<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #1c2a3a;
    --muted: #5b6b7d;
    --line: #c9d3de;
    --accent: #2f5fd0;
    --highlight: #fff3a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141b24;
      --panel: #1d2632;
      --ink: #e4ebf3;
      --muted: #93a3b6;
      --line: #334155;
      --accent: #7ea2ff;
      --highlight: #6b5d1f;
    }
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
  }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 42rem; }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 800;
    margin: 0 0 1.25rem;
    letter-spacing: -0.02em;
  }
  .mode-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .mode-tab {
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--ink);
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.25rem;
  }
  .data-panel { margin-bottom: 1rem; }
  .data-panel #data-status {
    margin: 0 0 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.85rem 1.25rem;
    margin-bottom: 1rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    transition: transform 0.25s ease;
  }
  .nav-bar.nav-hidden {
    transform: translateY(-130%);
  }
  .nav-bar select {
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
  }
  .nav-spacer { flex: 1; }
  .nav-btn {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  #bible-text {
    font-family: "Lora", Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--ink);
    user-select: text;
  }
  .book-heading {
    font-family: "Figtree", sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    margin: 2.5rem 0 1rem;
    scroll-margin-top: 5.5rem;
    text-align: center;
  }
  .book-heading:first-child { margin-top: 0; }
  .chapter-section {
    /* Skip layout/paint work for off-screen chapters - this is a ~1.6M px document with
       1,200 sections, and without this, fast scrolling causes rendering to fall behind
       (visible as white flashes) since the browser tries to keep it all painted at once. */
    content-visibility: auto;
    contain-intrinsic-size: 0 900px;
  }
  .chapter-heading {
    font-family: "Figtree", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--muted);
    margin: 1.5rem 0 0.5rem;
    scroll-margin-top: 5.5rem;
  }
  .verse-num {
    font-size: 0.7em;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.7;
    vertical-align: super;
    margin-right: 0.15em;
  }
  mark.highlight {
    background: var(--highlight);
    color: inherit;
    border-radius: 2px;
    cursor: pointer;
  }
  #highlighter-toggle[aria-pressed="false"] {
    background: transparent;
    color: var(--muted);
  }
  #bible-empty {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .comment-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 1.5rem;
  }
  .comment-box {
    background: var(--panel);
    border-radius: 14px;
    padding: 1.25rem;
    width: 100%;
    max-width: 24rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .comment-box label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-family: "Figtree", sans-serif;
  }
  #comment-input {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  .comment-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
    align-items: center;
  }
  .comment-actions button {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
  #comment-save {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #comment-remove, #highlight-remove {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
  }
  /* Anchored to the bottom of the screen rather than floating next to the
     selection - the browser's own Copy/Share callout already claims that
     spot on mobile, so following it there would just fight for the space. */
  .selection-menu {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
    padding: 0.5rem;
    padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .selection-menu button {
    padding: 0.55rem 0.8rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }
  .xref-box {
    max-width: 32rem;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .xref-box h3 {
    margin: 0 0 0.75rem;
    font-family: "Figtree", sans-serif;
    font-size: 1rem;
    color: var(--ink);
  }
  .xref-list {
    overflow-y: auto;
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.75rem;
    background: var(--bg);
  }
  .xref-entry {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
  }
  .xref-entry:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .xref-ref {
    font-weight: 600;
    font-family: "Figtree", sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font: inherit;
  }
  .xref-text {
    margin-top: 0.3rem;
    color: var(--ink);
    line-height: 1.6;
  }
  .xref-text .verse-num {
    font-size: 0.65em;
    vertical-align: super;
    color: var(--muted);
    margin-right: 0.1rem;
  }
  .xref-empty {
    color: var(--muted);
    padding: 0.5rem 0;
  }
  #comments-rail {
    position: fixed;
    top: 0;
    display: none;
    z-index: 4;
  }
  .comment-card {
    position: absolute;
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.55rem 0.7rem;
    font-family: "Figtree", sans-serif;
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
  /* On narrow screens there's no side margin for the rail - it becomes a
     swipe-out drawer instead, triggered from the handle tab on the right edge. */
  #comments-rail.drawer {
    top: 0;
    right: 0;
    left: auto;
    width: min(80vw, 320px);
    height: 100vh;
    overflow-y: auto;
    background: var(--panel);
    box-shadow: -6px 0 20px rgba(0, 0, 0, 0.25);
    padding: 4.5rem 1rem 1.5rem;
    box-sizing: border-box;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 45;
  }
  #comments-rail.drawer.open { transform: translateX(0); }
  #comments-rail.drawer .comment-card {
    position: static;
    margin-bottom: 0.75rem;
  }
  #comments-drawer-handle {
    display: none;
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px 0 0 10px;
    padding: 0.7rem 0.5rem;
    font-size: 1.2rem;
    line-height: 1;
    z-index: 46;
    cursor: pointer;
    box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
  }
  #comments-drawer-handle.visible { display: block; }
</style>
</head>
<body>
<div id="comments-rail"></div>
<button id="comments-drawer-handle" type="button" title="Comments" aria-label="Show comments">&#128172;</button>
<main>
  <h1>Read the Bible</h1>

  <div id="data-box" class="panel data-panel" style="display:none;">
    <div class="mode-tabs">
      <a href="index.html" class="mode-tab">Search</a>
      <a href="read.html" class="mode-tab active">Read</a>
    </div>
    <p id="data-status">Select your NIV data file (niv.json) to start reading. It's remembered in this browser afterward - never uploaded anywhere.</p>
    <div id="data-picker">
      <input id="data-file" type="file" accept="application/json,.json">
    </div>
  </div>

  <div id="reader" class="panel" style="display:none;">
    <div class="nav-bar">
      <a href="index.html" class="mode-tab">Search</a>
      <a href="read.html" class="mode-tab active">Read</a>
      <select id="book-select"></select>
      <select id="chapter-select"></select>
      <button id="prev-chapter" class="nav-btn" type="button" title="Back">&larr;</button>
      <button id="next-chapter" class="nav-btn" type="button" title="Forward">&rarr;</button>
      <span class="nav-spacer"></span>
    </div>
    <div id="bible-text"></div>
  </div>
  <div id="selection-menu" class="selection-menu" style="display:none;">
    <button id="selection-highlight-btn" type="button" title="Highlight" aria-label="Highlight">&#128397;&#65039;</button>
    <button id="selection-highlight-verse-btn" type="button" title="Highlight verse" aria-label="Highlight verse">&#128397;&#65039;</button>
    <button id="view-biblehub" type="button" title="View on BibleHub" aria-label="View on BibleHub">&#128279;</button>
    <button id="view-xrefs" type="button" title="Cross References" aria-label="Cross References">&#128256;</button>
  </div>
  <p id="bible-empty" style="display:none;">Load your NIV data file above to start reading.</p>

  <div id="xref-overlay" class="comment-overlay" style="display:none;">
    <div class="comment-box xref-box">
      <h3 id="xref-title">Cross References</h3>
      <div id="xref-list" class="xref-list"></div>
      <div class="comment-actions">
        <span class="nav-spacer"></span>
        <button id="xref-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div id="comment-overlay" class="comment-overlay" style="display:none;">
    <div class="comment-box">
      <label for="comment-input">Comment on this highlight</label>
      <textarea id="comment-input" rows="4"></textarea>
      <div class="comment-actions">
        <button id="comment-remove" type="button">Remove comment</button>
        <button id="highlight-remove" type="button">Remove highlight</button>
        <span class="nav-spacer"></span>
        <button id="comment-cancel" type="button">Cancel</button>
        <button id="comment-save" type="button">Save</button>
      </div>
    </div>
  </div>
</main>
<script>
  var DB_NAME = "bible-search-cache";
  var STORE_NAME = "kv";
  var DATA_KEY = "niv.json";
  var HIGHLIGHT_PREFIX = "highlights:";

  var BOOKS_IN_ORDER = [
    "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "Ruth",
    "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles",
    "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Proverbs", "Ecclesiastes", "Song of Solomon",
    "Isaiah", "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos", "Obadiah",
    "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi",
    "Matthew", "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians", "2 Corinthians",
    "Galatians", "Ephesians", "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians",
    "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews", "James", "1 Peter", "2 Peter",
    "1 John", "2 John", "3 John", "Jude", "Revelation"
  ];

  var nivData = null;
  var ALL_CHAPTERS = []; // flat [{book, chapter}] in reading order, built once data loads
  var currentIndex = -1; // index into ALL_CHAPTERS of whatever is nearest top of viewport
  var sectionObserver = null;
  var suppressObserver = false;

  var dataBox = document.getElementById("data-box");
  var dataStatus = document.getElementById("data-status");
  var dataFile = document.getElementById("data-file");
  var reader = document.getElementById("reader");
  var bookSelect = document.getElementById("book-select");
  var chapterSelect = document.getElementById("chapter-select");
  var prevBtn = document.getElementById("prev-chapter");
  var nextBtn = document.getElementById("next-chapter");
  var textEl = document.getElementById("bible-text");
  var emptyEl = document.getElementById("bible-empty");
  var selectionMenu = document.getElementById("selection-menu");
  var selectionHighlightBtn = document.getElementById("selection-highlight-btn");
  var selectionHighlightVerseBtn = document.getElementById("selection-highlight-verse-btn");

  var commentOverlay = document.getElementById("comment-overlay");
  var commentInput = document.getElementById("comment-input");
  var commentSaveBtn = document.getElementById("comment-save");
  var commentCancelBtn = document.getElementById("comment-cancel");
  var commentRemoveBtn = document.getElementById("comment-remove");
  var highlightRemoveBtn = document.getElementById("highlight-remove");
  var activeCommentMark = null;

  function openCommentEditor(mark) {
    activeCommentMark = mark;
    commentInput.value = mark.getAttribute("data-comment") || "";
    commentOverlay.style.display = "flex";
    commentInput.focus();
  }

  function closeCommentEditor() {
    commentOverlay.style.display = "none";
    activeCommentMark = null;
  }

  function applyComment(text) {
    if (!activeCommentMark) return;
    var mark = activeCommentMark;
    var section = mark.closest(".chapter-section");
    if (text && text.trim()) {
      mark.setAttribute("data-comment", text);
      mark.title = text;
      mark.classList.add("commented");
    } else {
      mark.removeAttribute("data-comment");
      mark.removeAttribute("title");
      mark.classList.remove("commented");
    }
    if (section) saveHighlightState(section);
    layoutCommentsRail();
  }

  function removeHighlightMark(mark) {
    var section = mark.closest(".chapter-section");
    var parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
    if (section) saveHighlightState(section);
    layoutCommentsRail();
  }

  // Shows existing comments as floating cards in the margin, positioned level with their
  // highlight - only for highlights currently near the viewport. On a narrow screen
  // there's no side margin to fit them, so instead they go in a swipe-out drawer from
  // the right edge, opened via the handle tab (tap or swipe).
  var commentsRail = document.getElementById("comments-rail");
  var commentsDrawerHandle = document.getElementById("comments-drawer-handle");
  var mainEl = document.querySelector("main");

  function openCommentsDrawer() { commentsRail.classList.add("open"); }
  function closeCommentsDrawer() { commentsRail.classList.remove("open"); }
  function toggleCommentsDrawer() { commentsRail.classList.toggle("open"); }

  function layoutCommentsRail() {
    var mainRect = mainEl.getBoundingClientRect();
    var available = window.innerWidth - mainRect.right;
    var drawerMode = available < 220;

    var marks = textEl.querySelectorAll("mark.highlight.commented");
    var cards = [];
    marks.forEach(function (mark) {
      var r = mark.getBoundingClientRect();
      if (r.bottom < -200 || r.top > window.innerHeight + 200) return;
      cards.push({ mark: mark, top: r.top });
    });

    if (drawerMode) {
      commentsRail.classList.add("drawer");
      commentsRail.style.display = "block";
      commentsRail.style.left = "";
      commentsRail.style.width = "";
      commentsDrawerHandle.classList.toggle("visible", cards.length > 0);
      if (!cards.length) closeCommentsDrawer();
    } else {
      commentsRail.classList.remove("drawer", "open");
      commentsDrawerHandle.classList.remove("visible");
      if (!cards.length) {
        commentsRail.style.display = "none";
        return;
      }
      var width = Math.min(260, available - 24);
      commentsRail.style.display = "block";
      commentsRail.style.left = (mainRect.right + 24) + "px";
      commentsRail.style.width = width + "px";
    }

    commentsRail.innerHTML = "";
    cards.forEach(function (c) {
      var card = document.createElement("div");
      card.className = "comment-card";
      if (!drawerMode) card.style.top = c.top + "px";
      card.textContent = c.mark.getAttribute("data-comment") || "";
      card.addEventListener("click", function () {
        if (drawerMode) closeCommentsDrawer();
        openCommentEditor(c.mark);
      });
      commentsRail.appendChild(card);
    });
  }

  commentsDrawerHandle.addEventListener("click", toggleCommentsDrawer);

  var handleTouchStartX = null;
  commentsDrawerHandle.addEventListener("touchstart", function (e) {
    handleTouchStartX = e.touches[0].clientX;
  }, { passive: true });
  commentsDrawerHandle.addEventListener("touchend", function (e) {
    if (handleTouchStartX === null) return;
    var dx = e.changedTouches[0].clientX - handleTouchStartX;
    handleTouchStartX = null;
    if (dx < -20) openCommentsDrawer();
  });

  var railTouchStartX = null;
  commentsRail.addEventListener("touchstart", function (e) {
    railTouchStartX = e.touches[0].clientX;
  }, { passive: true });
  commentsRail.addEventListener("touchend", function (e) {
    if (railTouchStartX === null) return;
    var dx = e.changedTouches[0].clientX - railTouchStartX;
    railTouchStartX = null;
    if (dx > 40) closeCommentsDrawer();
  });

  var railUpdateScheduled = false;
  function scheduleRailUpdate() {
    if (railUpdateScheduled) return;
    railUpdateScheduled = true;
    requestAnimationFrame(function () {
      railUpdateScheduled = false;
      layoutCommentsRail();
    });
  }
  window.addEventListener("scroll", scheduleRailUpdate, { passive: true });

  // Slide the nav bar out of the way while scrolling down (more room to read), and
  // bring it back as soon as the user scrolls up even slightly.
  var navBarEl = document.querySelector(".nav-bar");
  var lastScrollY = window.scrollY;
  var navScrollScheduled = false;
  function updateNavBarVisibility() {
    var y = window.scrollY;
    if (y > lastScrollY && y > navBarEl.offsetHeight) {
      navBarEl.classList.add("nav-hidden");
    } else if (y < lastScrollY) {
      navBarEl.classList.remove("nav-hidden");
    }
    lastScrollY = y;
  }
  window.addEventListener("scroll", function () {
    if (navScrollScheduled) return;
    navScrollScheduled = true;
    requestAnimationFrame(function () {
      navScrollScheduled = false;
      updateNavBarVisibility();
    });
  }, { passive: true });
  window.addEventListener("resize", scheduleRailUpdate);

  // Remember not just the current chapter but roughly where in it the user is, so
  // reopening the site snaps back to the exact verse they were last reading rather
  // than just the top of the chapter.
  var positionSaveScheduled = false;
  function saveLastPosition() {
    if (currentIndex === -1) return;
    var cur = ALL_CHAPTERS[currentIndex];
    var section = document.getElementById(sectionId(cur.book, cur.chapter));
    if (!section) return;
    var sups = section.querySelectorAll("sup.verse-num");
    var navBarHeight = navBarEl.offsetHeight;
    var verse = null;
    for (var i = 0; i < sups.length; i++) {
      if (sups[i].getBoundingClientRect().top >= navBarHeight) {
        verse = sups[i].textContent;
        break;
      }
    }
    if (verse) localStorage.setItem("read:lastVerse:" + cur.book + ":" + cur.chapter, verse);
  }
  window.addEventListener("scroll", function () {
    if (positionSaveScheduled) return;
    positionSaveScheduled = true;
    requestAnimationFrame(function () {
      positionSaveScheduled = false;
      saveLastPosition();
    });
  }, { passive: true });

  commentSaveBtn.addEventListener("click", function () {
    applyComment(commentInput.value);
    closeCommentEditor();
  });
  commentRemoveBtn.addEventListener("click", function () {
    applyComment("");
    closeCommentEditor();
  });
  highlightRemoveBtn.addEventListener("click", function () {
    if (activeCommentMark) removeHighlightMark(activeCommentMark);
    closeCommentEditor();
  });
  commentCancelBtn.addEventListener("click", closeCommentEditor);
  commentOverlay.addEventListener("click", function (e) {
    if (e.target === commentOverlay) closeCommentEditor();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && commentOverlay.style.display !== "none") closeCommentEditor();
  });

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE_NAME); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbGet(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE_NAME, "readonly");
        var req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }
  function idbSet(key, value) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function highlightKey(book, chapter) {
    return HIGHLIGHT_PREFIX + book + ":" + chapter;
  }

  function chapterNumbers(book) {
    var chapters = nivData[book];
    if (!chapters) return [];
    return Object.keys(chapters).map(function (c) { return parseInt(c, 10); })
      .sort(function (a, b) { return a - b; });
  }

  function sectionId(book, chapter) {
    return "ch-" + book.replace(/\s+/g, "_") + "-" + chapter;
  }

  function getUrlVerseTarget() {
    var params = new URLSearchParams(window.location.search);
    var book = params.get("book");
    var chapter = parseInt(params.get("chapter"), 10);
    if (!book || !chapter) return null;
    var verse = params.get("verse") ? parseInt(params.get("verse"), 10) : null;
    return { book: book, chapter: chapter, verse: verse };
  }

  function renderWholeBible() {
    ALL_CHAPTERS = [];
    var html = "";
    BOOKS_IN_ORDER.forEach(function (book) {
      if (!nivData[book]) return;
      html += '<h2 class="book-heading">' + book + '</h2>';
      chapterNumbers(book).forEach(function (chapter) {
        ALL_CHAPTERS.push({ book: book, chapter: chapter });
        var key = highlightKey(book, chapter);
        var saved = localStorage.getItem(key);
        html += '<section class="chapter-section" id="' + sectionId(book, chapter) + '" data-book="' + book + '" data-chapter="' + chapter + '">';
        html += '<h3 class="chapter-heading">' + book + ' ' + chapter + '</h3>';
        html += '<div class="verse-flow">';
        if (saved) {
          html += saved;
        } else {
          var verses = nivData[book][chapter];
          var verseNums = Object.keys(verses).map(function (v) { return parseInt(v, 10); })
            .sort(function (a, b) { return a - b; });
          verseNums.forEach(function (v) {
            html += '<sup class="verse-num">' + v + '</sup>' + verses[String(v)] + " ";
          });
        }
        html += '</div></section>';
      });
    });

    setupObserver();
  }

  function setupObserver() {
    if (sectionObserver) sectionObserver.disconnect();
    sectionObserver = new IntersectionObserver(function (entries) {
      if (suppressObserver) return;
      entries.forEach(function (entry) {

        var book = entry.target.getAttribute("data-book");
        var chapter = parseInt(entry.target.getAttribute("data-chapter"), 10);
        setCurrent(book, chapter, false);
      });
    }, { rootMargin: "-10% 0px -80% 0px" });
    document.querySelectorAll(".chapter-section").forEach(function (el) { sectionObserver.observe(el); });
  }

  function populateBooks() {
    bookSelect.innerHTML = "";
    BOOKS_IN_ORDER.forEach(function (book) {
      if (!nivData[book]) return;
      var opt = document.createElement("option");
      opt.value = book;
      opt.textContent = book;
      bookSelect.appendChild(opt);
    });
  }

  function populateChapterOptions(book) {
    var chapters = chapterNumbers(book);
    chapterSelect.innerHTML = "";
    chapters.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = String(c);
      opt.textContent = "Chapter " + c;
      chapterSelect.appendChild(opt);
    });
  }

  function setCurrent(book, chapter, scrollTo) {
    var idx = ALL_CHAPTERS.findIndex(function (c) { return c.book === book && c.chapter === chapter; });
    if (idx === -1) return;
    currentIndex = idx;

    if (bookSelect.value !== book) {
      bookSelect.value = book;
      populateChapterOptions(book);
    }
    chapterSelect.value = String(chapter);

    localStorage.setItem("read:lastBook", book);
    localStorage.setItem("read:lastChapter:" + book, String(chapter));

    if (scrollTo) {
      // The whole Bible is one very tall document (~1.6M px) - a "smooth" scroll across
      // large jumps can take many seconds, which raced against the observer suppression
      // window below. An instant jump avoids that entirely and is more practical here.
      suppressObserver = true;
      document.getElementById(sectionId(book, chapter)).scrollIntoView({ behavior: "auto", block: "start" });
      requestAnimationFrame(function () {

          layoutCommentsRail();
        });
      });

  function goTo(book, chapter) { setCurrent(book, chapter, true); }

  function readUrlFor(book, chapter) {
    return "read.html?book=" + encodeURIComponent(book) + "&chapter=" + chapter;
  }

  // Back/forward walk a history of chapters reached via a clicked verse link or a
  // book/chapter selection. This stays entirely inside Read mode - it never hands
  // off to the browser's own history, so it can never land back on Search.
  var navHistory = [];
  var navHistoryIndex = -1;

  function updateNavHistoryButtons() {
    prevBtn.disabled = navHistoryIndex <= 0;
    nextBtn.disabled = navHistoryIndex >= navHistory.length - 1;
  }

  function navigateViaLink(book, chapter) {
    var current = currentIndex !== -1 ? ALL_CHAPTERS[currentIndex] : null;
    navHistory = navHistory.slice(0, navHistoryIndex + 1);
    var top = navHistory[navHistory.length - 1];
    if (current && (!top || top.book !== current.book || top.chapter !== current.chapter)) {
      navHistory.push({ book: current.book, chapter: current.chapter });
    }
    navHistory.push({ book: book, chapter: chapter });
    navHistoryIndex = navHistory.length - 1;
    goTo(book, chapter);
    updateNavHistoryButtons();
  }

  function saveHighlightState(sectionEl) {
    var book = sectionEl.getAttribute("data-book");
    var chapter = sectionEl.getAttribute("data-chapter");

  }

  function wrapRangeInMark(range) {
    var mark = document.createElement("mark");

    } catch (e) {
      var contents = range.extractContents();
      mark.appendChild(contents);
      range.insertNode(mark);
    }
  }

  function hideSelectionMenu() {
    selectionMenu.style.display = "none";
  }

  function positionSelectionMenu() {
    // Anchored to the bottom of the screen via CSS - nothing to compute.
    selectionMenu.style.display = "flex";
  }

  function checkSelectionForMenu(clickX, clickY) {
    var hasCoords = typeof clickX === "number";
    if (commentOverlay.style.display !== "none") {
      hideSelectionMenu();
      return;
    }
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) {
      hideSelectionMenu();
      return;
    }
    // Without click coordinates (a selectionchange pass, used for mobile's handle-drag
    // selection UI, which never fires mouseup/touchend on the text itself) a bare caret
    // tells us nothing about intent - only act on an actual dragged-out selection here.
    if (sel.isCollapsed && !hasCoords) {
      hideSelectionMenu();
      return;
    }
    var range = sel.getRangeAt(0);
    var node = range.commonAncestorContainer;
    var el = node.nodeType === 1 ? node : node.parentElement;
    if (!el || !textEl.contains(el) || !findSelectionVerseRef()) {
      hideSelectionMenu();
      return;
    }
    // A tap/click in blank space (margins, gaps between verses/chapters) still snaps
    // the caret to the nearest letter - only treat it as "tapped on text" if the tap
    // actually landed on (or very near) the resolved caret position.
    if (sel.isCollapsed && hasCoords) {
      var caretRect = range.getBoundingClientRect();
      var tolerance = 10;
      var closeEnough = clickY >= caretRect.top - tolerance && clickY <= caretRect.bottom + tolerance &&
        clickX >= caretRect.left - tolerance && clickX <= caretRect.right + tolerance;
      if (!closeEnough) {
        hideSelectionMenu();
        return;
      }
    }
    selectionHighlightBtn.style.display = sel.isCollapsed ? "none" : "";
    selectionHighlightVerseBtn.style.display = sel.isCollapsed ? "" : "none";
    positionSelectionMenu();
  }

  // Only show the popup as a direct result of interacting with the verse text itself -
  // never from stale selections, page load, or clicking the grey panel border around it.
  // A real touchend is always followed by a synthetic mousedown/mouseup/click a moment
  // later for compatibility - lastTouchTime lets the handlers below ignore those, since
  // otherwise the "click away" dismiss-er below would immediately close what the touch
  // had just opened.
  var lastTouchTime = 0;
  textEl.addEventListener("mouseup", function (e) {
    if (Date.now() - lastTouchTime < 600) return;
    var clickX = e.clientX, clickY = e.clientY;
    requestAnimationFrame(function () { checkSelectionForMenu(clickX, clickY); });

  textEl.addEventListener("touchend", function (e) {

  // return above for why a bare caret is ignored on this path.
  var selectionChangeScheduled = false;

    selectionChangeScheduled = true;
    requestAnimationFrame(function () {

      checkSelectionForMenu();
    });
  });

  document.addEventListener("mousedown", function (e) {
    if (Date.now() - lastTouchTime < 600) return;
    if (selectionMenu.contains(e.target) || textEl.contains(e.target)) return;
    hideSelectionMenu();
  });

  window.addEventListener("scroll", hideSelectionMenu, { passive: true });

  selectionHighlightBtn.addEventListener("mousedown", function (e) {
    e.preventDefault(); // keep the text selection alive through the click
  });

  selectionHighlightBtn.addEventListener("click", function () {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) {
      hideSelectionMenu();
      return;
    }
    var range = sel.getRangeAt(0);
    var section = range.commonAncestorContainer;
    section = section.nodeType === 1 ? section.closest(".chapter-section") : section.parentElement.closest(".chapter-section");
    hideSelectionMenu();
    if (!section) return;
    wrapRangeInMark(range);
    sel.removeAllRanges();

  });

  function findVerseRange(section, verseNum) {
    var flow = section.querySelector(".verse-flow");
    if (!flow) return null;
    var sups = Array.from(flow.querySelectorAll("sup.verse-num"));
    var idx = sups.findIndex(function (s) { return s.textContent === String(verseNum); });
    if (idx === -1) return null;
    var range = document.createRange();
    range.setStartAfter(sups[idx]);
    if (sups[idx + 1]) {
      range.setEndBefore(sups[idx + 1]);
    } else {
      range.setEnd(flow, flow.childNodes.length);
    }
    return range;
  }

  selectionHighlightVerseBtn.addEventListener("mousedown", function (e) {
    e.preventDefault();
  });

  selectionHighlightVerseBtn.addEventListener("click", function () {
    var ref = findSelectionVerseRef();
    hideSelectionMenu();
    if (!ref) return;
    var section = document.getElementById(sectionId(ref.book, ref.chapter));
    if (!section) return;
    var range = findVerseRange(section, ref.verse);
    if (!range) return;
    wrapRangeInMark(range);
    window.getSelection().removeAllRanges();
    saveHighlightState(section);
  });

  textEl.addEventListener("click", function (e) {
    var mark = e.target.closest ? e.target.closest("mark.highlight") : null;
    if (!mark) return;
    openCommentEditor(mark);
  });

  var BIBLEHUB_SLUGS = { "Song of Solomon": "songs" };

  function bibleHubSlug(book) {
    return BIBLEHUB_SLUGS[book] || book.toLowerCase().replace(/\s+/g, "_");
  }

  function findSelectionVerseRef() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    var range = sel.getRangeAt(0);
    var startNode = range.startContainer;
    var startEl = startNode.nodeType === 1 ? startNode : startNode.parentElement;
    var section = startEl ? startEl.closest(".chapter-section") : null;
    var flow = section ? section.querySelector(".verse-flow") : null;
    if (!flow) return null;

    var verse = null;
    var walker = document.createTreeWalker(flow, NodeFilter.SHOW_ALL, null);
    var node;
    while ((node = walker.nextNode())) {
      if (node.nodeType === 1 && node.classList.contains("verse-num")) {
        verse = node.textContent;
      }
      if (node === startNode || (node.nodeType === 1 && node.contains(startNode))) {
        break;
      }
    }
    if (verse === null) return null;
    return { book: section.dataset.book, chapter: section.dataset.chapter, verse: verse };
  }

  var viewBibleHubBtn = document.getElementById("view-biblehub");
  viewBibleHubBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  viewBibleHubBtn.addEventListener("click", function () {
    var ref = findSelectionVerseRef();
    hideSelectionMenu();
    if (!ref) return;
    var url = "https://biblehub.com/" + bibleHubSlug(ref.book) + "/" + ref.chapter + "-" + ref.verse + ".htm";
    window.open(url, "_blank");
  });

  var FULL_TO_ABBR = {
    "Genesis": "Gen", "Exodus": "Exod", "Leviticus": "Lev", "Numbers": "Num", "Deuteronomy": "Deut",
    "Joshua": "Josh", "Judges": "Judg", "Ruth": "Ruth", "1 Samuel": "1Sam", "2 Samuel": "2Sam",
    "1 Kings": "1Kgs", "2 Kings": "2Kgs", "1 Chronicles": "1Chr", "2 Chronicles": "2Chr",
    "Ezra": "Ezra", "Nehemiah": "Neh", "Esther": "Esth", "Job": "Job", "Psalms": "Ps",
    "Proverbs": "Prov", "Ecclesiastes": "Eccl", "Song of Solomon": "Song", "Isaiah": "Isa",
    "Jeremiah": "Jer", "Lamentations": "Lam", "Ezekiel": "Ezek", "Daniel": "Dan", "Hosea": "Hos",
    "Joel": "Joel", "Amos": "Amos", "Obadiah": "Obad", "Jonah": "Jonah", "Micah": "Mic",
    "Nahum": "Nah", "Habakkuk": "Hab", "Zephaniah": "Zeph", "Haggai": "Hag", "Zechariah": "Zech",
    "Malachi": "Mal", "Matthew": "Matt", "Mark": "Mark", "Luke": "Luke", "John": "John",
    "Acts": "Acts", "Romans": "Rom", "1 Corinthians": "1Cor", "2 Corinthians": "2Cor",
    "Galatians": "Gal", "Ephesians": "Eph", "Philippians": "Phil", "Colossians": "Col",
    "1 Thessalonians": "1Thess", "2 Thessalonians": "2Thess", "1 Timothy": "1Tim", "2 Timothy": "2Tim",
    "Titus": "Titus", "Philemon": "Phlm", "Hebrews": "Heb", "James": "Jas", "1 Peter": "1Pet",
    "2 Peter": "2Pet", "1 John": "1John", "2 John": "2John", "3 John": "3John", "Jude": "Jude",
    "Revelation": "Rev"
  };
  var ABBR_TO_FULL = {};
  Object.keys(FULL_TO_ABBR).forEach(function (full) { ABBR_TO_FULL[FULL_TO_ABBR[full]] = full; });

  var xrefData = null;
  var xrefFetchPromise = null;
  function loadXrefData() {
    if (xrefData) return Promise.resolve(xrefData);
    if (xrefFetchPromise) return xrefFetchPromise;
    xrefFetchPromise = fetch("data/cross_references.json").then(function (res) {
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      return res.json();
    }).then(function (json) {
      xrefData = json;
      return xrefData;
    });
    return xrefFetchPromise;
  }

  function nextChapterRef(book, chapter) {
    var chapters = chapterNumbers(book);
    var idx = chapters.indexOf(chapter);
    if (idx !== -1 && idx + 1 < chapters.length) {
      return { book: book, chapter: chapters[idx + 1] };
    }
    var bookIdx = BOOKS_IN_ORDER.indexOf(book);
    for (var i = bookIdx + 1; i < BOOKS_IN_ORDER.length; i++) {
      var nb = BOOKS_IN_ORDER[i];
      var nChapters = chapterNumbers(nb);
      if (nChapters.length) return { book: nb, chapter: nChapters[0] };
    }
    return null;
  }

  function collectRangeVerses(startBook, startCh, startV, endBook, endCh, endV) {
    var out = [];
    var book = startBook, chapter = startCh, verse = startV;
    var guard = 0;
    while (guard++ < 80) {
      var chapterVerses = nivData[book] && nivData[book][chapter];
      if (!chapterVerses) break;
      var text = chapterVerses[String(verse)];
      if (text) out.push({ book: book, chapter: chapter, verse: verse, text: text });
      if (book === endBook && chapter === endCh && verse === endV) break;
      var verseNums = Object.keys(chapterVerses).map(Number).sort(function (a, b) { return a - b; });
      var vIdx = verseNums.indexOf(verse);
      if (vIdx !== -1 && vIdx + 1 < verseNums.length) {
        verse = verseNums[vIdx + 1];
      } else {
        var nxt = nextChapterRef(book, chapter);
        if (!nxt) break;
        book = nxt.book;
        chapter = nxt.chapter;
        var nextVerseNums = Object.keys(nivData[book][chapter]).map(Number).sort(function (a, b) { return a - b; });
        verse = nextVerseNums[0];
      }
    }
    return out;
  }

  function formatXrefLabel(sb, sc, sv, eb, ec, ev) {
    if (sb === eb && sc === ec && sv === ev) return sb + " " + sc + ":" + sv;
    if (sb === eb && sc === ec) return sb + " " + sc + ":" + sv + "-" + ev;
    if (sb === eb) return sb + " " + sc + ":" + sv + "-" + ec + ":" + ev;
    return sb + " " + sc + ":" + sv + " - " + eb + " " + ec + ":" + ev;
  }

  var xrefOverlay = document.getElementById("xref-overlay");
  var xrefList = document.getElementById("xref-list");
  var xrefTitle = document.getElementById("xref-title");
  var xrefCloseBtn = document.getElementById("xref-close");
  var viewXrefsBtn = document.getElementById("view-xrefs");

  function closeXrefOverlay() {
    xrefOverlay.style.display = "none";
  }

  function renderXrefList(ref, abbr) {
    xrefTitle.textContent = "Cross References — " + ref.book + " " + ref.chapter + ":" + ref.verse;
    var entries = (xrefData[abbr] && xrefData[abbr][String(ref.chapter)] && xrefData[abbr][String(ref.chapter)][String(ref.verse)]) || [];
    if (!entries.length) {
      xrefList.innerHTML = '<p class="xref-empty">No cross references found for this verse.</p>';
      return;
    }
    xrefList.innerHTML = "";
    entries.forEach(function (e) {
      var sb = ABBR_TO_FULL[e[0]], sc = e[1], sv = e[2], eb = ABBR_TO_FULL[e[3]], ec = e[4], ev = e[5];
      if (!sb || !eb) return;
      var label = formatXrefLabel(sb, sc, sv, eb, ec, ev);
      var verses = collectRangeVerses(sb, sc, sv, eb, ec, ev);

      var entryEl = document.createElement("div");
      entryEl.className = "xref-entry";

      var btn = document.createElement("button");
      btn.className = "xref-ref";
      btn.type = "button";
      btn.textContent = label;
      btn.addEventListener("click", function () {
        closeXrefOverlay();
        navigateViaLink(sb, sc);
      });
      entryEl.appendChild(btn);

      var textBox = document.createElement("div");
      textBox.className = "xref-text";
      if (verses.length) {
        textBox.innerHTML = verses.map(function (v) {
          return '<sup class="verse-num">' + v.verse + '</sup>' + v.text;
        }).join(" ");
      } else {
        textBox.textContent = "(verse text unavailable)";
      }
      entryEl.appendChild(textBox);

      xrefList.appendChild(entryEl);
    });
  }

  viewXrefsBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  viewXrefsBtn.addEventListener("click", function () {
    var ref = findSelectionVerseRef();
    hideSelectionMenu();
    if (!ref) return;
    var abbr = FULL_TO_ABBR[ref.book];
    xrefOverlay.style.display = "flex";
    xrefList.innerHTML = '<p class="xref-empty">Loading…</p>';
    loadXrefData().then(function () {
      renderXrefList(ref, abbr);
    }).catch(function () {
      xrefList.innerHTML = '<p class="xref-empty">Couldn’t load cross reference data.</p>';
    });
  });

  xrefCloseBtn.addEventListener("click", closeXrefOverlay);
  xrefOverlay.addEventListener("click", function (e) {
    if (e.target === xrefOverlay) closeXrefOverlay();
  });

  bookSelect.addEventListener("change", function () {
    populateChapterOptions(bookSelect.value);
    var chapters = chapterNumbers(bookSelect.value);
    navigateViaLink(bookSelect.value, chapters[0]);
  });
  chapterSelect.addEventListener("change", function () {
    navigateViaLink(bookSelect.value, parseInt(chapterSelect.value, 10));
  });

  prevBtn.addEventListener("click", function () {
    if (navHistoryIndex > 0) {
      navHistoryIndex--;
      var c = navHistory[navHistoryIndex];
      setCurrent(c.book, c.chapter, true);
      updateNavHistoryButtons();
    }
  });
  nextBtn.addEventListener("click", function () {
    if (navHistoryIndex < navHistory.length - 1) {
      navHistoryIndex++;
      var c = navHistory[navHistoryIndex];
      setCurrent(c.book, c.chapter, true);
      updateNavHistoryButtons();
    }
  });

  function refreshDataUI(loaded) {
    dataBox.style.display = loaded ? "none" : "block";
    if (!loaded) {
      dataStatus.textContent = "Select your NIV data file (niv.json) to start reading. It's remembered in this browser afterward - never uploaded anywhere.";
      nivData = null;
    }
    emptyEl.style.display = loaded ? "none" : "block";
    reader.style.display = loaded ? "block" : "none";
    if (!loaded) return;

    populateBooks();
    renderWholeBible();

    var urlTarget = getUrlVerseTarget();
    var lastBook = localStorage.getItem("read:lastBook");
    var lastChapter = localStorage.getItem("read:lastChapter:" + lastBook);
    var startBook = (urlTarget && nivData[urlTarget.book]) ? urlTarget.book
      : (lastBook && nivData[lastBook]) ? lastBook : BOOKS_IN_ORDER[0];
    var chapters = chapterNumbers(startBook);
    var startChapter = (urlTarget && urlTarget.book === startBook && chapters.indexOf(urlTarget.chapter) !== -1) ? urlTarget.chapter
      : (lastChapter && chapters.indexOf(parseInt(lastChapter, 10)) !== -1) ? parseInt(lastChapter, 10) : chapters[0];

    var lastVerse = localStorage.getItem("read:lastVerse:" + startBook + ":" + startChapter);
    var targetVerse = (urlTarget && urlTarget.book === startBook && urlTarget.chapter === startChapter) ? urlTarget.verse
      : (!urlTarget && lastVerse) ? parseInt(lastVerse, 10) : null;

    populateChapterOptions(startBook);
    history.replaceState(null, "", readUrlFor(startBook, startChapter));
    navHistory = [{ book: startBook, chapter: startChapter }];
    navHistoryIndex = 0;
    // Delay the initial jump a couple of frames so it doesn't race the IntersectionObserver's
    // own initial "burst" callback for the ~1200 sections it just started observing.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setCurrent(startBook, startChapter, true);
        updateNavHistoryButtons();
        if (targetVerse) {
          var section = document.getElementById(sectionId(startBook, startChapter));
          var sup = section && Array.prototype.find.call(
            section.querySelectorAll("sup.verse-num"),
            function (s) { return s.textContent === String(targetVerse); }
          );

      });
    });
  }

  dataFile.addEventListener("change", function () {
    var file = dataFile.files && dataFile.files[0];

    reader2.onload = function () {
      try {
        nivData = JSON.parse(reader2.result);

    if (!text) { refreshDataUI(false); return; }
    try {
      nivData = JSON.parse(text);
      refreshDataUI(true);
    } catch (e) {
      refreshDataUI(false);
    }
  }).catch(function () { refreshDataUI(false); });
</script>
