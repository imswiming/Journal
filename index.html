<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #1c2a3a;
    --muted: #5b6b7d;
    --line: #c9d3de;
    --accent: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141b24;
      --panel: #1d2632;
      --ink: #e4ebf3;
      --muted: #93a3b6;
      --line: #334155;
      --accent: #7ea2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 40rem; }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 800;
    margin: 0 0 1.25rem;
    letter-spacing: -0.02em;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.25rem;
  }
  /* Loosen the CSE iframe/table so it doesn't overflow the panel on narrow screens */
  .gsc-control-cse, .gsc-control-cse table, .gsc-input-box, .gsc-search-box {
    max-width: 100% !important;
  }
  /* Google renders its own result list below the box; we replace it with #results-list,
     so it's hidden by default. If a search hangs (e.g. Google serves a CAPTCHA/"unusual
     traffic" challenge in this same container instead of firing "ready"), .results-stuck
     is added after a timeout so the native UI becomes visible and solvable. */
  body:not(.results-stuck) .gsc-results-wrapper-nooverlay,
  body:not(.results-stuck) .gsc-results-wrapper-overlay,
  body:not(.results-stuck) .gsc-modal-background-image {
    display: none !important;
  }
  /* Google locks background scroll behind its (hidden) overlay via this class and never
     unlocks it since we never trigger its own close; force scrolling back on. */
  body.gsc-overflow-hidden {
    overflow: visible !important;
  }
  #results-status {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #results-list {
    list-style: none;
    margin: 0.5rem 0 0;
    padding: 0;
  }
  #results-list li {
    border-top: 1px solid var(--line);
    padding: 0.85rem 0;
  }
  #results-list li:first-child {
    border-top: none;
  }
  #results-list a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  #results-list a:hover {
    text-decoration: underline;
  }
  #results-list .result-url {
    display: block;
    margin-top: 0.2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #results-list .result-verse {
    display: block;
    margin-top: 0.4rem;
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.45;
  }
  #results-list .result-verse .verse-ref {
    font-weight: 600;
    color: inherit;
    text-decoration: none;
  }
  #results-list .result-verse .verse-ref:hover {
    text-decoration: underline;
  }
  #results-list .result-verse .verse-version {
    color: var(--muted);
    font-weight: 400;
  }
  #results-list .result-toggle {
    cursor: pointer;
  }
  #results-list .verse-context {
    margin-top: 0.6rem;
    padding: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    max-height: 16rem;
    overflow-y: auto;
  }
  #results-list .verse-context .result-verse {
    display: block;
    color: var(--muted);
    margin-top: 0.6rem;
  }
  #results-list .verse-context .result-verse:first-child {
    margin-top: 0;
  }
  #results-list .verse-context .verse-found {
    color: var(--ink);
    background: var(--panel);
    border-radius: 6px;
    padding: 0.4rem 0.5rem;
    margin-left: -0.5rem;
    margin-right: -0.5rem;
  }
  #results-list .source-link {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
  }
  #results-list .xref-link {
    cursor: pointer;
    margin-left: 0.75rem;
  }
  #results-list .xref-entry {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
  }
  #results-list .xref-entry:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  #results-list .xref-entry-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-block;
  }
  #results-list .xref-entry-label:hover {
    text-decoration: underline;
  }
  #results-list .xref-empty {
    color: var(--muted);
    margin: 0;
  }
  .mode-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .mode-tab {
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--ink);
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .data-panel {
    margin-bottom: 1rem;
  }
  .data-panel #data-status {
    margin: 0 0 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #data-file {
    color: var(--ink);
    font: inherit;
  }
</style>
</head>
<body>
<main>
  <h1>Search the bible</h1>
  <div class="mode-tabs">
    <a href="index.html" class="mode-tab active">Search</a>
    <a href="read.html" class="mode-tab">Read</a>
  </div>
  <div id="data-box" class="panel data-panel">
    <p id="data-status">Select your NIV data file (niv.json) to enable verse lookups. It's remembered in this browser afterward - never uploaded anywhere.</p>
    <div id="data-picker">
      <input id="data-file" type="file" accept="application/json,.json">
    </div>
  </div>
  <div class="panel">
    <div class="gcse-search"></div>
    <p id="results-status"></p>
    <ul id="results-list"></ul>
  </div>
</main>
<script>
  var resultsRenderedForQuery = false;
  var stuckTimer = null;

  // Bible books containing links are ranked first in the results list below.
  var BIBLE_BOOKS = [
    "genesis", "exodus", "leviticus", "numbers", "deuteronomy", "joshua", "judges", "ruth",
    "1 samuel", "2 samuel", "1 kings", "2 kings", "1 chronicles", "2 chronicles",
    "ezra", "nehemiah", "esther", "job", "psalm", "psalms", "proverbs", "ecclesiastes",
    "song of solomon", "song of songs", "isaiah", "jeremiah", "lamentations", "ezekiel",
    "daniel", "hosea", "joel", "amos", "obadiah", "jonah", "micah", "nahum", "habakkuk",
    "zephaniah", "haggai", "zechariah", "malachi", "matthew", "mark", "luke", "john", "acts",
    "romans", "1 corinthians", "2 corinthians", "galatians", "ephesians", "philippians",
    "colossians", "1 thessalonians", "2 thessalonians", "1 timothy", "2 timothy", "titus",
    "philemon", "hebrews", "james", "1 peter", "2 peter", "1 john", "2 john", "3 john",
    "jude", "revelation"
  ];
  var BOOK_PATTERN = new RegExp(
    "\\b(" + BIBLE_BOOKS.map(function (b) { return b.replace(/\s+/g, "\\s+"); }).join("|") + ")\\b",
    "i"
  );

  function mentionsBibleBook(text) {
    return BOOK_PATTERN.test(text || "");
  }

  // NIV text is supplied by the user as a local file and cached in this browser's
  // IndexedDB - it's never uploaded or fetched from any server. Keyed as
  // book -> chapter -> verse -> text, same shape the rest of this file expects.
  var DB_NAME = "bible-search-cache";
  var STORE_NAME = "kv";
  var DATA_KEY = "niv.json";

  var nivData = null;
  var dataBox = document.getElementById("data-box");
  var dataStatus = document.getElementById("data-status");
  var dataFile = document.getElementById("data-file");

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE_NAME); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE_NAME, "readonly");
        var req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function idbSet(key, value) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function refreshDataUI(loaded) {
    dataBox.style.display = loaded ? "none" : "block";
    if (!loaded) {
      dataStatus.textContent = "Select your NIV data file (niv.json) to enable verse lookups. It's remembered in this browser afterward - never uploaded anywhere.";
      nivData = null;
    }
  }

  dataFile.addEventListener("change", function () {
    var file = dataFile.files && dataFile.files[0];
    if (!file) return;
    dataStatus.textContent = "Loading…";
    var reader = new FileReader();
    reader.onload = function () {
      try {
        nivData = JSON.parse(reader.result);
      } catch (e) {
        dataStatus.textContent = "That file didn't look like valid JSON - try again.";
        return;
      }
      idbSet(DATA_KEY, reader.result).then(function () { refreshDataUI(true); });
    };
    reader.onerror = function () {
      dataStatus.textContent = "Couldn't read that file - try again.";
    };
    reader.readAsText(file);
  });

  idbGet(DATA_KEY).then(function (text) {
    if (!text) { refreshDataUI(false); return; }
    try {
      nivData = JSON.parse(text);
      refreshDataUI(true);
    } catch (e) {
      refreshDataUI(false);
    }
  }).catch(function () { refreshDataUI(false); });

  var BOOK_ALIASES = {
    "genesis": "Genesis", "exodus": "Exodus", "leviticus": "Leviticus", "numbers": "Numbers",
    "deuteronomy": "Deuteronomy", "joshua": "Joshua", "judges": "Judges", "ruth": "Ruth",
    "1 samuel": "1 Samuel", "2 samuel": "2 Samuel", "1 kings": "1 Kings", "2 kings": "2 Kings",
    "1 chronicles": "1 Chronicles", "2 chronicles": "2 Chronicles",
    "ezra": "Ezra", "nehemiah": "Nehemiah", "esther": "Esther", "job": "Job",
    "psalm": "Psalms", "psalms": "Psalms",
    "proverbs": "Proverbs", "ecclesiastes": "Ecclesiastes",
    "song of solomon": "Song of Solomon", "song of songs": "Song of Solomon",
    "isaiah": "Isaiah", "jeremiah": "Jeremiah", "lamentations": "Lamentations",
    "ezekiel": "Ezekiel", "daniel": "Daniel", "hosea": "Hosea", "joel": "Joel", "amos": "Amos",
    "obadiah": "Obadiah", "jonah": "Jonah", "micah": "Micah", "nahum": "Nahum",
    "habakkuk": "Habakkuk", "zephaniah": "Zephaniah", "haggai": "Haggai", "zechariah": "Zechariah",
    "malachi": "Malachi", "matthew": "Matthew", "mark": "Mark", "luke": "Luke", "john": "John",
    "acts": "Acts", "romans": "Romans", "1 corinthians": "1 Corinthians", "2 corinthians": "2 Corinthians",
    "galatians": "Galatians", "ephesians": "Ephesians", "philippians": "Philippians", "colossians": "Colossians",
    "1 thessalonians": "1 Thessalonians", "2 thessalonians": "2 Thessalonians",
    "1 timothy": "1 Timothy", "2 timothy": "2 Timothy", "titus": "Titus", "philemon": "Philemon",
    "hebrews": "Hebrews", "james": "James", "1 peter": "1 Peter", "2 peter": "2 Peter",
    "1 john": "1 John", "2 john": "2 John", "3 john": "3 John", "jude": "Jude", "revelation": "Revelation"
  };
  var REF_ALIAS_KEYS = Object.keys(BOOK_ALIASES).sort(function (a, b) { return b.length - a.length; });
  var REFERENCE_PATTERN = new RegExp(
    "^(" + REF_ALIAS_KEYS.map(function (k) { return k.replace(/\s+/g, "\\s+"); }).join("|") + ")\\s+(\\d{1,3}):(\\d{1,3})",
    "i"
  );

  function extractReference(title) {
    var m = REFERENCE_PATTERN.exec((title || "").trim());
    if (!m) return null;
    var book = BOOK_ALIASES[m[1].toLowerCase().replace(/\s+/g, " ")];
    return { book: book, chapter: m[2], verse: m[3], label: book + " " + m[2] + ":" + m[3] };
  }

  function lookupVerseText(ref) {
    if (!nivData || !ref) return null;
    var chapters = nivData[ref.book];
    if (!chapters) return null;
    var verses = chapters[ref.chapter];
    if (!verses) return null;
    return verses[ref.verse] || null;
  }

  function readUrl(book, chapter, verse) {
    return "read.html?book=" + encodeURIComponent(book) + "&chapter=" + chapter + "&verse=" + verse;
  }

  function buildVerseLine(book, chapter, verse, text) {
    var line = document.createElement("span");
    line.className = "result-verse";

    var refEl = document.createElement("a");
    refEl.className = "verse-ref";
    refEl.href = readUrl(book, chapter, verse);
    refEl.textContent = book + " " + chapter + ":" + verse + " ";
    line.appendChild(refEl);

    line.appendChild(document.createTextNode(text));
    return line;
  }

  function getChapterVerses(book, chapter) {
    var chapters = nivData && nivData[book];
    var verses = chapters && chapters[String(chapter)];
    if (!verses) return [];
    return Object.keys(verses)
      .map(function (v) { return parseInt(v, 10); })
      .sort(function (a, b) { return a - b; })
      .map(function (v) { return { verse: v, text: verses[String(v)] }; });
  }

  var BOOKS_IN_ORDER = [
    "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "Ruth",
    "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles",
    "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Proverbs", "Ecclesiastes", "Song of Solomon",
    "Isaiah", "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos", "Obadiah",
    "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi",
    "Matthew", "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians", "2 Corinthians",
    "Galatians", "Ephesians", "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians",
    "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews", "James", "1 Peter", "2 Peter",
    "1 John", "2 John", "3 John", "Jude", "Revelation"
  ];

  var FULL_TO_ABBR = {
    "Genesis": "Gen", "Exodus": "Exod", "Leviticus": "Lev", "Numbers": "Num", "Deuteronomy": "Deut",
    "Joshua": "Josh", "Judges": "Judg", "Ruth": "Ruth", "1 Samuel": "1Sam", "2 Samuel": "2Sam",
    "1 Kings": "1Kgs", "2 Kings": "2Kgs", "1 Chronicles": "1Chr", "2 Chronicles": "2Chr",
    "Ezra": "Ezra", "Nehemiah": "Neh", "Esther": "Esth", "Job": "Job", "Psalms": "Ps",
    "Proverbs": "Prov", "Ecclesiastes": "Eccl", "Song of Solomon": "Song", "Isaiah": "Isa",
    "Jeremiah": "Jer", "Lamentations": "Lam", "Ezekiel": "Ezek", "Daniel": "Dan", "Hosea": "Hos",
    "Joel": "Joel", "Amos": "Amos", "Obadiah": "Obad", "Jonah": "Jonah", "Micah": "Mic",
    "Nahum": "Nah", "Habakkuk": "Hab", "Zephaniah": "Zeph", "Haggai": "Hag", "Zechariah": "Zech",
    "Malachi": "Mal", "Matthew": "Matt", "Mark": "Mark", "Luke": "Luke", "John": "John",
    "Acts": "Acts", "Romans": "Rom", "1 Corinthians": "1Cor", "2 Corinthians": "2Cor",
    "Galatians": "Gal", "Ephesians": "Eph", "Philippians": "Phil", "Colossians": "Col",
    "1 Thessalonians": "1Thess", "2 Thessalonians": "2Thess", "1 Timothy": "1Tim", "2 Timothy": "2Tim",
    "Titus": "Titus", "Philemon": "Phlm", "Hebrews": "Heb", "James": "Jas", "1 Peter": "1Pet",
    "2 Peter": "2Pet", "1 John": "1John", "2 John": "2John", "3 John": "3John", "Jude": "Jude",
    "Revelation": "Rev"
  };
  var ABBR_TO_FULL = {};
  Object.keys(FULL_TO_ABBR).forEach(function (full) { ABBR_TO_FULL[FULL_TO_ABBR[full]] = full; });

  var xrefData = null;
  var xrefFetchPromise = null;
  function loadXrefData() {
    if (xrefData) return Promise.resolve(xrefData);
    if (xrefFetchPromise) return xrefFetchPromise;
    xrefFetchPromise = fetch("data/cross_references.json").then(function (res) {
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      return res.json();
    }).then(function (json) {
      xrefData = json;
      return xrefData;
    });
    return xrefFetchPromise;
  }

  function chapterNumbersIdx(book) {
    var chapters = nivData && nivData[book];
    if (!chapters) return [];
    return Object.keys(chapters).map(function (c) { return parseInt(c, 10); })
      .sort(function (a, b) { return a - b; });
  }

  function nextChapterRef(book, chapter) {
    var chapters = chapterNumbersIdx(book);
    var idx = chapters.indexOf(chapter);
    if (idx !== -1 && idx + 1 < chapters.length) {
      return { book: book, chapter: chapters[idx + 1] };
    }
    var bookIdx = BOOKS_IN_ORDER.indexOf(book);
    for (var i = bookIdx + 1; i < BOOKS_IN_ORDER.length; i++) {
      var nb = BOOKS_IN_ORDER[i];
      var nChapters = chapterNumbersIdx(nb);
      if (nChapters.length) return { book: nb, chapter: nChapters[0] };
    }
    return null;
  }

  function collectRangeVerses(startBook, startCh, startV, endBook, endCh, endV) {
    var out = [];
    var book = startBook, chapter = startCh, verse = startV;
    var guard = 0;
    while (guard++ < 80) {
      var chapterVerses = nivData[book] && nivData[book][chapter];
      if (!chapterVerses) break;
      var text = chapterVerses[String(verse)];
      if (text) out.push({ book: book, chapter: chapter, verse: verse, text: text });
      if (book === endBook && chapter === endCh && verse === endV) break;
      var verseNums = Object.keys(chapterVerses).map(Number).sort(function (a, b) { return a - b; });
      var vIdx = verseNums.indexOf(verse);
      if (vIdx !== -1 && vIdx + 1 < verseNums.length) {
        verse = verseNums[vIdx + 1];
      } else {
        var nxt = nextChapterRef(book, chapter);
        if (!nxt) break;
        book = nxt.book;
        chapter = nxt.chapter;
        var nextVerseNums = Object.keys(nivData[book][chapter]).map(Number).sort(function (a, b) { return a - b; });
        verse = nextVerseNums[0];
      }
    }
    return out;
  }

  function formatXrefLabel(sb, sc, sv, eb, ec, ev) {
    if (sb === eb && sc === ec && sv === ev) return sb + " " + sc + ":" + sv;
    if (sb === eb && sc === ec) return sb + " " + sc + ":" + sv + "-" + ev;
    if (sb === eb) return sb + " " + sc + ":" + sv + "-" + ec + ":" + ev;
    return sb + " " + sc + ":" + sv + " - " + eb + " " + ec + ":" + ev;
  }

  function renderXrefEntries(container, ref) {
    var abbr = FULL_TO_ABBR[ref.book];
    var chapterEntries = xrefData[abbr] && xrefData[abbr][String(ref.chapter)];
    var entries = (chapterEntries && chapterEntries[String(ref.verse)]) || [];
    if (!entries.length) {
      container.innerHTML = '<p class="xref-empty">No cross references found for this verse.</p>';
      return;
    }
    container.innerHTML = "";
    entries.forEach(function (e) {
      var sb = ABBR_TO_FULL[e[0]], sc = e[1], sv = e[2], eb = ABBR_TO_FULL[e[3]], ec = e[4], ev = e[5];
      if (!sb || !eb) return;
      var entryEl = document.createElement("div");
      entryEl.className = "xref-entry";

      var label = document.createElement("a");
      label.className = "xref-entry-label";
      label.href = readUrl(sb, sc, sv);
      label.textContent = formatXrefLabel(sb, sc, sv, eb, ec, ev);
      entryEl.appendChild(label);

      var verses = collectRangeVerses(sb, sc, sv, eb, ec, ev);
      if (verses.length) {
        verses.forEach(function (v) {
          entryEl.appendChild(buildVerseLine(v.book, v.chapter, v.verse, v.text));
        });
      } else {
        var unavailable = document.createElement("span");
        unavailable.className = "result-verse";
        unavailable.textContent = "(verse text unavailable)";
        entryEl.appendChild(unavailable);
      }
      container.appendChild(entryEl);
    });
  }

  // Google may hand back HTML-highlighted titles; strip tags without executing any script content.
  function stripHtml(html) {
    if (!html) return "";
    return new DOMParser().parseFromString(html, "text/html").body.textContent || "";
  }

  function normalizeGoogleResult(r) {
    return {
      title: r.titleNoFormatting || stripHtml(r.title) || r.url,
      url: r.url,
      visibleUrl: r.visibleUrl || r.formattedUrl || r.url
    };
  }

  // Reads whatever Google has currently rendered into its own (hidden) results DOM.
  // Used for pages 2/3, which the widget does not surface through searchCallbacks.
  function scrapeVisibleResults() {
    var nodes = document.querySelectorAll(".gsc-webResult.gsc-result");
    var out = [];
    nodes.forEach(function (el) {
      var a = el.querySelector("a.gs-title");
      if (!a) return;
      var urlLong = el.querySelector(".gs-visibleUrl-long");
      var urlShort = el.querySelector(".gs-visibleUrl-short");
      out.push({
        title: a.textContent.trim(),
        url: a.href,
        visibleUrl: (urlLong && urlLong.textContent.trim()) || (urlShort && urlShort.textContent.trim()) || a.href
      });
    });
    return out;
  }

  function goToResultsPage(pageNumber) {
    var cursor = null;
    document.querySelectorAll(".gsc-cursor-page").forEach(function (el) {
      if (el.textContent.trim() === String(pageNumber)) cursor = el;
    });
    if (!cursor) return false;
    ["pointerdown", "mousedown", "pointerup", "mouseup", "click"].forEach(function (type) {
      cursor.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window }));
    });
    return true;
  }

  function waitForResultsUpdate(timeoutMs) {
    return new Promise(function (resolve) {
      var wrapper = document.querySelector(".gsc-results-wrapper-nooverlay, .gsc-results-wrapper-overlay");
      if (!wrapper) { resolve(); return; }
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        observer.disconnect();
        resolve();
      }, timeoutMs);
      var observer = new MutationObserver(function () {
        if (done) return;
        done = true;
        observer.disconnect();
        clearTimeout(timer);
        setTimeout(resolve, 50);
      });
      observer.observe(wrapper, { childList: true, subtree: true });
    });
  }

  // Google's element widget only reports page 1 through searchCallbacks.ready; pages 2+
  // are fetched by simulating clicks on its own (hidden) pagination and scraping the DOM.
  // onPage(itemsSoFar) fires after each page so the list can render progressively.
  function fetchAdditionalPages(maxPage, onPage) {
    var allExtra = [];
    var chain = Promise.resolve();
    var _loop = function (pageNum) {
      chain = chain.then(function () {
        var moved = goToResultsPage(pageNum);
        if (!moved) return;
        return waitForResultsUpdate(3000).then(function () {
          allExtra = allExtra.concat(scrapeVisibleResults());
          if (onPage) onPage(allExtra.slice());
        });
      });
    };
    for (var p = 2; p <= maxPage; p++) _loop(p);
    return chain.then(function () {
      goToResultsPage(1);
      return allExtra;
    });
  }

  function markStillLoading() {
    var status = document.getElementById("results-status");
    if (!/ \(loading more…\)$/.test(status.textContent)) {
      status.textContent += " (loading more…)";
    }
  }

  function clearStillLoading() {
    var status = document.getElementById("results-status");
    status.textContent = status.textContent.replace(/ \(loading more…\)$/, "");
  }

  function renderResults(items) {
    var list = document.getElementById("results-list");
    var status = document.getElementById("results-status");
    list.innerHTML = "";

    if (!items || !items.length) {
      status.textContent = "";
      return;
    }

    items = items.filter(function (item) {
      return !!extractReference(item.title);
    });

    if (!items.length) {
      status.textContent = "No Bible verse results found.";
      return;
    }

    var ranked = items
      .map(function (item, index) {
        return {
          item: item,
          index: index,
          isBook: mentionsBibleBook(item.title) || mentionsBibleBook(item.visibleUrl)
        };
      })
      .sort(function (a, b) {
        if (a.isBook !== b.isBook) return a.isBook ? -1 : 1;
        return a.index - b.index;
      })
      .map(function (entry) { return entry.item; });

    var seenRefs = {};
    var deduped = ranked.filter(function (item) {
      var ref = extractReference(item.title);
      if (!ref) return true;
      if (seenRefs[ref.label]) return false;
      seenRefs[ref.label] = true;
      return true;
    });

    deduped.forEach(function (item) {
      var li = document.createElement("li");

      var ref = extractReference(item.title);
      var verseText = ref ? lookupVerseText(ref) : null;

      if (verseText) {
        var toggle = document.createElement("a");
        toggle.href = "#";
        toggle.className = "result-toggle";
        toggle.textContent = item.title;
        li.appendChild(toggle);

        var verseLine = buildVerseLine(ref.book, ref.chapter, ref.verse, verseText + " ");
        var versionEl = document.createElement("span");
        versionEl.className = "verse-version";
        versionEl.textContent = "(NIV)";
        verseLine.appendChild(versionEl);
        li.appendChild(verseLine);

        var context = document.createElement("div");
        context.className = "verse-context";
        context.style.display = "none";

        var chapterVerses = getChapterVerses(ref.book, ref.chapter);
        var foundLineEl = null;
        chapterVerses.forEach(function (v) {
          var line = buildVerseLine(ref.book, ref.chapter, v.verse, v.text);
          if (String(v.verse) === ref.verse) {
            line.classList.add("verse-found");
            foundLineEl = line;
          }
          context.appendChild(line);
        });
        li.appendChild(context);
        toggle.addEventListener("click", function (e) {
          e.preventDefault();
          var expanded = context.style.display !== "none";
          context.style.display = expanded ? "none" : "block";
          verseLine.style.display = expanded ? "block" : "none";
          if (!expanded && foundLineEl) {
            foundLineEl.scrollIntoView({ block: "center" });
          }
        });

        var sourceLink = document.createElement("a");
        sourceLink.className = "source-link";
        sourceLink.href = item.url;
        sourceLink.target = "_blank";
        sourceLink.rel = "noopener noreferrer";
        sourceLink.textContent = "View source ↗";
        li.appendChild(sourceLink);

        var xrefToggle = document.createElement("a");
        xrefToggle.href = "#";
        xrefToggle.className = "source-link xref-link";
        xrefToggle.textContent = "Cross references";
        li.appendChild(xrefToggle);

        var xrefBox = document.createElement("div");
        xrefBox.className = "verse-context";
        xrefBox.style.display = "none";
        li.appendChild(xrefBox);

        var xrefLoaded = false;
        xrefToggle.addEventListener("click", function (e) {
          e.preventDefault();
          var expanded = xrefBox.style.display !== "none";
          xrefBox.style.display = expanded ? "none" : "block";
          if (!expanded && !xrefLoaded) {
            xrefLoaded = true;
            xrefBox.innerHTML = '<p class="xref-empty">Loading…</p>';
            loadXrefData().then(function () {
              renderXrefEntries(xrefBox, ref);
            }).catch(function () {
              xrefBox.innerHTML = '<p class="xref-empty">Couldn’t load cross reference data.</p>';
            });
          }
        });
      } else {
        var a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.title;
        li.appendChild(a);

        var urlLine = document.createElement("span");
        urlLine.className = "result-url";
        urlLine.textContent = item.visibleUrl;
        li.appendChild(urlLine);
      }

      list.appendChild(li);
    });
  }

  window.__gcse = {
    searchCallbacks: {
      web: {
        starting: function () {
          resultsRenderedForQuery = false;
          document.body.classList.remove("results-stuck");
          clearTimeout(stuckTimer);
          // If "ready" hasn't fired after a few seconds, Google may be showing a
          // CAPTCHA/"unusual traffic" challenge in its (normally hidden) native UI
          // instead - reveal it so that's visible and solvable rather than hidden forever.
          stuckTimer = setTimeout(function () {
            document.body.classList.add("results-stuck");
          }, 4000);
          document.getElementById("results-status").textContent = "Searching…";
          document.getElementById("results-list").innerHTML = "";
        },
        ready: function (googName, query, promotions, results) {
          // Google's widget can re-fire "ready" as it lazily loads more results while
          // the (hidden) native results area is scrolled. Rebuilding the list on every
          // firing collapses expanded verses and resets scroll position, so only the
          // first firing per query kicks off rendering.
          if (resultsRenderedForQuery) return;
          clearTimeout(stuckTimer);
          document.body.classList.remove("results-stuck");
          resultsRenderedForQuery = true;

          var page1Items = (results || []).map(normalizeGoogleResult);
          renderResults(page1Items);
          markStillLoading();

          fetchAdditionalPages(3, function (extraSoFar) {
            renderResults(page1Items.concat(extraSoFar));
            markStillLoading();
          }).then(function () {
            clearStillLoading();
          });
        }
      }
    }
  };
</script>
