<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Search &amp; Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<!-- The Google Custom Search box (cse.js, loaded at the bottom of <body>)
     pulls in its own additional scripts/styles from these origins once it
     starts - the DNS/TLS handshake for each is otherwise paid fresh, serially,
     the moment cse.js first needs them, which is exactly when the search box
     looks unresponsive on a slow connection. Preconnecting here lets that
     handshake happen in the background while the rest of the page loads. -->
<link rel="preconnect" href="https://www.google.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<!-- Moved here (still `async`, so it doesn't block parsing) from the bottom
     of <body> so the browser starts fetching it immediately instead of only
     after parsing the rest of this ~3000-line document - the search box is
     unresponsive until this finishes, so starting it sooner directly cuts
     that wait. -->
<script async src="https://cse.google.com/cse.js?cx=c46bbd043c00a4bb7"></script>
<!-- Notes uses CKEditor 5 as its rich-text backend, vendored locally
     (vendor/ckeditor5/) rather than loaded from ckeditor.com's own CDN -
     CKEditor's CDN build requires a paid license key even for basic use;
     only the npm-distributed build (what's vendored here) accepts the
     free 'GPL' key (see initNotesEditor's licenseKey config). At ~2MB, it's
     NOT loaded here - see ensureNotesEditorLoaded, which injects it lazily
     only once the Notes column actually scrolls into view, so everyone who
     never opens Notes never pays for it. -->
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #1c2a3a;
    --muted: #5b6b7d;
    --line: #c9d3de;
    --accent: #2f5fd0;
    --highlight: #fff3a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141b24;
      --panel: #1d2632;
      --ink: #e4ebf3;
      --muted: #93a3b6;
      --line: #334155;
      --accent: #7ea2ff;
      --highlight: #6b5d1f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  h1 {
    font-size: clamp(1.4rem, 4vw, 1.8rem);
    font-weight: 800;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.25rem;
  }
  .data-panel { margin-bottom: 1rem; }
  .data-panel #data-status {
    margin: 0 0 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  /* A single shared gate: nothing else is usable until the NIV text is loaded,
     since every column depends on it. */
  #data-gate {
    max-width: 32rem;
    margin: 2rem auto;
    padding: 0 1.5rem;
  }

  /* ---------- Column shell ---------- */
  .column-tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    transition: transform 0.25s ease;
  }
  .column-tabs.tabs-hidden { transform: translateY(-130%); }
  .column-tab {
    flex: 1;
    text-align: center;
    padding: 0.55rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .column-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .columns-wrap {
    display: flex;
    height: calc(100vh - 56px);
    height: calc(100dvh - 56px);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .columns-wrap::-webkit-scrollbar { display: none; }
  .column {
    flex: 0 0 100vw;
    max-width: 100vw;
    scroll-snap-align: start;
    overflow-y: auto;
    height: 100%;
    scrollbar-width: none;
  }
  .column::-webkit-scrollbar { display: none; }
  .column-pad {
    padding: 1.25rem 1.25rem 3rem;
    max-width: 40rem;
    margin: 0 auto;
  }
  #col-comments .column-pad { max-width: 28rem; }
  #col-activity .column-pad { max-width: 22rem; }

  /* Comments isn't part of the mobile pager - its column and tab only exist
     on the wide desktop layout below. See layoutMobileCommentBadges for the
     mobile replacement. */
  #col-comments, .column-tab[data-target="col-comments"], #col-activity { display: none; }

  /* Mobile pager order (Notes, Bible, Search) via flex `order`, independent of
     each section's actual position in the HTML - overridden back to document
     order (Search, Read, Comments, Activity, Notes) on desktop below. Comments
     and Activity are hidden on mobile so their order here doesn't matter. */
  #col-notes { order: 1; }
  #col-read { order: 2; }
  #col-search { order: 3; }

  /* ---------- Notes column (CKEditor 5) ---------- */
  .notes-toolbar-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .notes-toolbar-btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.8rem;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
    font-family: inherit;
  }
  .notes-toolbar-btn:hover { background: var(--bg); }
  .notes-toolbar-btn:disabled { opacity: 0.5; cursor: default; }
  .notes-toolbar-btn:disabled:hover { background: var(--panel); }
  .notes-tab-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .notes-tab {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.3rem 0.5rem 0.3rem 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .notes-tab.active { color: var(--ink); border-color: var(--accent); }
  .notes-tab-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    color: var(--muted);
  }
  .notes-tab-close:hover { background: var(--bg); color: var(--ink); }
  .notes-tab-add { padding: 0.3rem 0.65rem; color: var(--accent); }
  #notes-editor-wrap { min-height: 50vh; }
  /* CKEditor ships its own light-theme chrome (border, box-shadow, base text
     color) on .ck-content - overridden here to blend into .panel instead.
     !important is needed since ckeditor5.css loads after this stylesheet and
     targets these same properties with equal-or-higher specificity. */
  #notes-editor-wrap .ck.ck-content {
    background: transparent !important;
    border: none !important;
    color: var(--ink) !important;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    padding: 0 !important;
    box-shadow: none !important;
    min-height: 50vh;
  }
  #notes-editor-wrap .ck.ck-content p,
  #notes-editor-wrap .ck.ck-content h4,
  #notes-editor-wrap .ck.ck-content li { margin: 0; }
  #notes-editor-wrap .ck.ck-content > * + * { margin-top: 0.5em; }
  #notes-editor-wrap .ck.ck-content h4 { font-size: 1.3rem; font-weight: 800; }
  #notes-editor-wrap .ck.ck-content ul,
  #notes-editor-wrap .ck.ck-content ol { padding-left: 1.6em; margin: 0.2em 0; }
  #notes-editor-wrap .ck.ck-content .todo-list { list-style: none; }
  #notes-editor-wrap .ck.ck-content .todo-list__label input[type="checkbox"] { cursor: pointer; }
  #notes-editor-wrap .ck.ck-content .todo-list__label:has(input:checked) .todo-list__label__description {
    text-decoration: line-through;
    color: var(--muted);
  }
  /* CKEditor's Highlight plugin config's "color" option only feeds its UI
     swatch preview - the real background comes from this static class, reusing
     the same --highlight used for Bible verse highlights. */
  #notes-editor-wrap .ck.ck-content mark.marker-yellow { background-color: var(--highlight) !important; }
  .mobile-comment-badge {
    position: fixed;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    z-index: 6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }

  @media (min-width: 1100px) {
    .column-tabs { display: none; }
    .mobile-comment-badge { display: none; }
    .columns-wrap {
      height: 100vh;
      overflow-x: visible;
      scroll-snap-type: none;
    }
    .column {
      flex: 1 1 0;
      max-width: none;
      border-right: 1px solid var(--line);
    }
    .column:last-child { border-right: none; }
    #col-search { flex: 1 1 0; min-width: 20rem; }
    #col-read { flex: 1.8 1 0; min-width: 28rem; }
    /* Cards are positioned to line up with their highlight's on-screen position
       in Read, which only makes sense if this column isn't also scrolling on
       its own. */
    #col-comments { flex: 1 1 0; min-width: 18rem; overflow-y: hidden; display: block; }
    #col-activity { flex: 1 1 0; min-width: 16rem; display: block; }
    #col-notes { flex: 1.3 1 0; min-width: 22rem; }
    /* Restore left-to-right document order on desktop (Notes is last). */
    #col-search { order: 1; }
    #col-read { order: 2; }
    #col-comments { order: 3; }
    #col-activity { order: 4; }
    #col-notes { order: 5; }
  }

  /* ---------- Search column ---------- */
  .gsc-control-cse, .gsc-control-cse table, .gsc-input-box, .gsc-search-box {
    max-width: 100% !important;
  }
  body:not(.results-stuck) .gsc-results-wrapper-nooverlay,
  body:not(.results-stuck) .gsc-results-wrapper-overlay,
  body:not(.results-stuck) .gsc-modal-background-image {
    display: none !important;
  }
  body.gsc-overflow-hidden {
    overflow: visible !important;
  }
  #results-status {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #results-list {
    list-style: none;
    margin: 0.5rem 0 0;
    padding: 0;
  }
  #results-list li {
    border-top: 1px solid var(--line);
    padding: 0.85rem 0;
  }
  #results-list li:first-child { border-top: none; }
  #results-list a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  #results-list a:hover { text-decoration: underline; }
  #results-list .result-url {
    display: block;
    margin-top: 0.2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #results-list .result-verse {
    display: block;
    margin-top: 0.4rem;
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.45;
  }
  #results-list .result-verse .verse-ref {
    font-weight: 600;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  #results-list .result-verse .verse-ref:hover { text-decoration: underline; }
  #results-list .result-verse .verse-version {
    color: var(--muted);
    font-weight: 400;
  }
  #results-list .result-toggle { cursor: pointer; }
  #results-list .verse-context {
    margin-top: 0.6rem;
    padding: 0.75rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    max-height: 16rem;
    overflow-y: auto;
  }
  #results-list .verse-context .result-verse {
    display: block;
    color: var(--muted);
    margin-top: 0.6rem;
  }
  #results-list .verse-context .result-verse:first-child { margin-top: 0; }
  #results-list .verse-context .verse-found {
    color: var(--ink);
    background: var(--panel);
    border-radius: 6px;
    padding: 0.4rem 0.5rem;
    margin-left: -0.5rem;
    margin-right: -0.5rem;
  }
  #results-list .source-link {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
  }
  #results-list .xref-link {
    cursor: pointer;
    margin-left: 0.75rem;
  }
  #results-list .xref-entry {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
  }
  #results-list .xref-entry:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  #results-list .xref-entry-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
  }
  #results-list .xref-entry-label:hover { text-decoration: underline; }
  #results-list .xref-empty {
    color: var(--muted);
    margin: 0;
  }

  /* ---------- Read column ---------- */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.85rem 1.25rem;
    margin-bottom: 1rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    transition: transform 0.25s ease;
  }
  .nav-bar.nav-hidden { transform: translateY(-130%); }
  .nav-bar select {
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
  }
  .nav-spacer { flex: 1; }
  .nav-btn {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  #bible-text {
    font-family: "Lora", Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--ink);
    user-select: text;
  }
  @font-face {
    font-family: "Orange Avenue";
    src: url("data/orange-avenue-demo.regular.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
  }
  .book-heading {
    font-family: "Orange Avenue", "Figtree", sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    margin: 2.5rem 0 1rem;
    scroll-margin-top: 5.5rem;
    text-align: center;
  }
  .book-heading:first-child { margin-top: 0; }
  .chapter-section {
    content-visibility: auto;
    contain-intrinsic-size: 0 900px;
  }
  .chapter-heading {
    font-family: "Figtree", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--muted);
    margin: 1.5rem 0 0.5rem;
    scroll-margin-top: 5.5rem;
  }
  .verse-num {
    font-size: 0.7em;
    font-weight: 700;
    color: var(--accent);
    vertical-align: super;
    margin-right: 0.15em;
  }
  mark.highlight {
    background: var(--highlight);
    color: inherit;
    border-radius: 2px;
    cursor: pointer;
  }
  #bible-empty { color: var(--muted); font-size: 0.9rem; }

  .comment-box label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-family: "Figtree", sans-serif;
  }
  #comment-overlay {
    position: fixed;
    inset: auto 0 0 0;
    background: var(--panel);
    display: none;
    border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.25);
    padding: 1rem;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 50;
    max-width: 40rem;
    margin: 0 auto;
    left: 0;
    right: 0;
  }
  #comment-input {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  .comment-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
    align-items: center;
  }
  .comment-actions button {
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
  #comment-remove, #highlight-remove {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
  }
  #mark-read-today {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-size: 0.85rem;
  }
  /* Anchored to the bottom of the screen rather than floating next to the
     selection - the browser's own Copy/Share callout already claims that
     spot on mobile, so following it there would just fight for the space. */
  .selection-menu {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
    padding: 0.5rem;
    padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .selection-menu button {
    padding: 0.5rem 0.9rem;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 1.5rem;
  }
  .modal-box {
    background: var(--panel);
    border-radius: 14px;
    padding: 1.25rem;
    width: 100%;
    max-width: 24rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  #text-prompt-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--ink);
    font-family: "Figtree", sans-serif;
  }
  #text-prompt-input {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    box-sizing: border-box;
  }
  .xref-box {
    max-width: 32rem;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .xref-box h3 {
    margin: 0 0 0.75rem;
    font-family: "Figtree", sans-serif;
    font-size: 1rem;
    color: var(--ink);
  }
  .xref-list {
    overflow-y: auto;
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.75rem;
    background: var(--bg);
  }
  .xref-entry {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
  }
  .xref-entry:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .xref-ref {
    font-weight: 600;
    font-family: "Figtree", sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font: inherit;
  }
  .xref-text {
    margin-top: 0.3rem;
    color: var(--ink);
    line-height: 1.6;
  }
  .xref-text .verse-num {
    font-size: 0.65em;
    vertical-align: super;
    color: var(--accent);
    margin-right: 0.1rem;
  }
  .xref-empty {
    color: var(--muted);
    padding: 0.5rem 0;
  }

  /* ---------- Comments column ---------- */
  .comment-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.7rem 0.85rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    z-index: 4;
  }
  .comment-card .comment-card-ref {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.85rem;
    margin-bottom: 0.3rem;
  }
  .comment-card .comment-card-highlight {
    color: var(--muted);
    font-size: 0.8rem;
    font-style: italic;
    margin-bottom: 0.35rem;
  }
  .comment-card .comment-card-text {
    color: var(--ink);
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  #comments-empty, #activity-empty {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .activity-date-heading {
    font-family: "Figtree", sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 1.1rem 0 0.5rem;
  }
  .activity-date-heading:first-child { margin-top: 0; }
  .activity-entry {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.6rem;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .activity-entry .activity-ref {
    font-weight: 700;
    color: var(--accent);
  }

  /* The daily gratitude box (a <blockquote> - see ensureTodaysDateBlock) -

<body>

<div id="data-gate">
  <h1>Bible Search &amp; Read</h1>
  <div id="data-box" class="panel data-panel">
    <p id="data-status">Loading Bible text&hellip;</p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="column-tabs">
    <button class="column-tab" type="button" data-target="col-notes">Text Editor</button>
    <button class="column-tab" type="button" data-target="col-read">Bible</button>
    <button class="column-tab" type="button" data-target="col-search">Search</button>
    <button class="column-tab" type="button" data-target="col-comments">Comments</button>
  </div>
  <div class="columns-wrap" id="columns-wrap">

    <section class="column" id="col-search">
      <div class="column-pad">
        <h1>Search the Bible</h1>
        <div class="panel">
          <div class="gcse-search"></div>
          <p id="results-status"></p>
          <ul id="results-list"></ul>
        </div>
      </div>
    </section>

    <section class="column" id="col-read">
      <div class="column-pad">
        <h1>Read the Bible</h1>
        <div id="reader" class="panel">
          <div class="nav-bar">
            <select id="book-select"></select>
            <select id="chapter-select"></select>
            <button id="prev-chapter" class="nav-btn" type="button" title="Back">&larr;</button>
            <button id="next-chapter" class="nav-btn" type="button" title="Forward">&rarr;</button>
            <span class="nav-spacer"></span>
          </div>
          <div id="bible-text"></div>
        </div>
        <p id="bible-empty" style="display:none;">The Bible text is still loading.</p>
      </div>
    </section>

    <section class="column" id="col-comments">
      <div class="column-pad">
        <h1>Comments</h1>
        <div id="comments-list"></div>
        <p id="comments-empty">No comments yet - tap a highlight in Read to add one.</p>
      </div>
    </section>

    <section class="column" id="col-activity">
      <div class="column-pad">
        <h1>Recent Activity</h1>
        <div id="activity-list"></div>
        <p id="activity-empty">No activity yet.</p>
      </div>
    </section>

    <section class="column" id="col-notes">
      <div class="column-pad">
        <h1>Notes</h1>
        <div id="notes-tab-bar" class="notes-tab-bar"></div>
        <div id="notes-toolbar" class="notes-toolbar-row"></div>
        <div id="notes-editor-wrap" class="panel">
          <div id="notes-editor"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<div id="selection-menu" class="selection-menu" style="display:none;">
  <button id="selection-highlight-btn" type="button">Highlight</button>
  <button id="selection-highlight-verse-btn" type="button">Highlight verse</button>
  <button id="view-biblehub" type="button">View on BibleHub</button>
  <button id="view-xrefs" type="button">Cross References</button>
  <button id="selection-overview-btn" type="button">Add to Notes</button>
</div>

<div id="xref-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box xref-box">
    <h3 id="xref-title">Cross References</h3>

      <span class="nav-spacer"></span>

</div>

<!-- A self-contained replacement for window.prompt() (see showTextPrompt) -
     native prompt() throws rather than showing anything in some mobile
     browser contexts (embedded webviews, standalone/PWA mode), which would
     otherwise make the Notes tab bar's +/rename silently fail there. -->
<div id="text-prompt-overlay" class="modal-overlay" style="display:none;">

      <button id="text-prompt-ok" type="button">OK</button>

</div>

<script>
  var HIGHLIGHT_PREFIX = "highlights:";

  var BOOKS_IN_ORDER = [
    "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "Ruth",
    "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles",
    "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Proverbs", "Ecclesiastes", "Song of Solomon",
    "Isaiah", "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos", "Obadiah",
    "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi",
    "Matthew", "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians", "2 Corinthians",
    "Galatians", "Ephesians", "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians",
    "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews", "James", "1 Peter", "2 Peter",
    "1 John", "2 John", "3 John", "Jude", "Revelation"
  ];

  var FULL_TO_ABBR = {
    "Genesis": "Gen", "Exodus": "Exod", "Leviticus": "Lev", "Numbers": "Num", "Deuteronomy": "Deut",
    "Joshua": "Josh", "Judges": "Judg", "Ruth": "Ruth", "1 Samuel": "1Sam", "2 Samuel": "2Sam",
    "1 Kings": "1Kgs", "2 Kings": "2Kgs", "1 Chronicles": "1Chr", "2 Chronicles": "2Chr",
    "Ezra": "Ezra", "Nehemiah": "Neh", "Esther": "Esth", "Job": "Job", "Psalms": "Ps",
    "Proverbs": "Prov", "Ecclesiastes": "Eccl", "Song of Solomon": "Song", "Isaiah": "Isa",
    "Jeremiah": "Jer", "Lamentations": "Lam", "Ezekiel": "Ezek", "Daniel": "Dan", "Hosea": "Hos",
    "Joel": "Joel", "Amos": "Amos", "Obadiah": "Obad", "Jonah": "Jonah", "Micah": "Mic",
    "Nahum": "Nah", "Habakkuk": "Hab", "Zephaniah": "Zeph", "Haggai": "Hag", "Zechariah": "Zech",
    "Malachi": "Mal", "Matthew": "Matt", "Mark": "Mark", "Luke": "Luke", "John": "John",
    "Acts": "Acts", "Romans": "Rom", "1 Corinthians": "1Cor", "2 Corinthians": "2Cor",
    "Galatians": "Gal", "Ephesians": "Eph", "Philippians": "Phil", "Colossians": "Col",
    "1 Thessalonians": "1Thess", "2 Thessalonians": "2Thess", "1 Timothy": "1Tim", "2 Timothy": "2Tim",
    "Titus": "Titus", "Philemon": "Phlm", "Hebrews": "Heb", "James": "Jas", "1 Peter": "1Pet",
    "2 Peter": "2Pet", "1 John": "1John", "2 John": "2John", "3 John": "3John", "Jude": "Jude",
    "Revelation": "Rev"
  };
  var ABBR_TO_FULL = {};
  Object.keys(FULL_TO_ABBR).forEach(function (full) { ABBR_TO_FULL[FULL_TO_ABBR[full]] = full; });

  var nivData = null;

  // ============================================================
  // Shared: fetch the bundled NIV JSON (one file per book) on load
  // ============================================================
  var dataStatus = document.getElementById("data-status");
  var dataGate = document.getElementById("data-gate");
  var appEl = document.getElementById("app");

  var BIBLE_DATA_DIR = "data/Bible-niv-main/";
  var BIBLE_FILE_OVERRIDES = { "Song of Solomon": "Song Of Solomon" };

  function refreshDataUI(loaded) {
    dataGate.style.display = loaded ? "none" : "block";
    appEl.style.display = loaded ? "block" : "none";
    if (!loaded) return;
    // Search is the mobile landing page by default - set synchronously right
    // as #app actually becomes visible (not via scrollIntoView, which only
    // runs on a later rAF). Doing this any earlier is a no-op: #app is
    // display:none until this point, so every column's offsetLeft reads as 0
    // beforehand. Without this, the Notes/Bible/Search pager order (see
    // #col-notes's `order`) would otherwise leave Notes showing at the
    // default scrollLeft of 0 - including to the Notes column's own
    // visibility check (see ensureNotesEditorLoaded), loading it unasked for.
    // A deep link (see initReader's urlTarget) overrides this with its own
    // later jump to Read.
    if (!isDesktopColumns()) {
      var defaultLandingCol = document.getElementById("col-search");
      if (defaultLandingCol) columnsWrap.scrollLeft = defaultLandingCol.offsetLeft;
    }
    initReader();
    renderCommentsColumn();
    renderActivityColumn();

    // Warms up layout once, during idle time, rather than paying for it the
    // first time the user actually focuses a text field. The resize listener
    // a bit further down (search for "content-visibility:auto sections")
    // explains why a forced layout read is so expensive on this page the
    // very first time: it makes the browser re-evaluate content-visibility
    // for all ~1,189 chapter sections in one synchronous pass. Doing that
    // once now, while nothing is waiting on it, means there's markedly less
    // left to do in that same pass later, when the keyboard opening forces
    // one for real.
    var warmUpLayout = function () { document.body.getBoundingClientRect(); };
    if (window.requestIdleCallback) {
      requestIdleCallback(warmUpLayout, { timeout: 3000 });
    } else {
      setTimeout(warmUpLayout, 2000);
    }
  }

  // Cached in IndexedDB after the first successful load - otherwise every
  // single visit re-downloads and re-parses ~6MB across 66 requests, which is
  // slow enough on mobile data to make the whole app feel sluggish right out
  // of the gate. Bump the key's version suffix if nivData's shape ever
  // changes, so an old cached shape doesn't linger.
  var BIBLE_DB_NAME = "bible-data-cache";
  var BIBLE_STORE_NAME = "kv";
  var BIBLE_CACHE_KEY = "nivData-v1";

  function openBibleDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(BIBLE_DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(BIBLE_STORE_NAME); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function bibleDbGet(key) {
    return openBibleDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(BIBLE_STORE_NAME, "readonly");
        var req = tx.objectStore(BIBLE_STORE_NAME).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }
  function bibleDbSet(key, value) {
    return openBibleDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(BIBLE_STORE_NAME, "readwrite");
        tx.objectStore(BIBLE_STORE_NAME).put(value, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function fetchBibleDataFromNetwork() {
    return Promise.all(BOOKS_IN_ORDER.map(function (book) {
      var fileName = BIBLE_FILE_OVERRIDES[book] || book;
      return fetch(BIBLE_DATA_DIR + encodeURIComponent(fileName) + ".json")
        .then(function (res) {
          if (!res.ok) throw new Error("fetch failed for " + book + ": " + res.status);
          return res.json();
        })
        .then(function (bookJson) {
          var chapters = {};
          bookJson.chapters.forEach(function (ch) {
            var verses = {};
            ch.verses.forEach(function (v) { verses[String(v.verse)] = v.text; });
            chapters[String(ch.chapter)] = verses;
          });
          nivData = nivData || {};
          nivData[book] = chapters;
        });
    })).then(function () {
      // Fire-and-forget - the app shouldn't wait on the cache write to render.
      bibleDbSet(BIBLE_CACHE_KEY, nivData).catch(function () { /* e.g. private browsing - just re-fetch next time */ });
    });
  }

  bibleDbGet(BIBLE_CACHE_KEY).then(function (cached) {
    if (cached) {
      nivData = cached;
      return;
    }
    return fetchBibleDataFromNetwork();
  }).catch(function () {
    // IndexedDB unavailable/broken - fall back to a plain network fetch.
    return fetchBibleDataFromNetwork();
  }).then(function () {
    refreshDataUI(true);
  }).catch(function (err) {
    console.error(err);
    dataStatus.textContent = "Couldn't load the Bible text - try reloading the page.";
  });

  // ============================================================
  // Shared: cross references + verse range helpers
  // ============================================================
  var xrefData = null;
  var xrefFetchPromise = null;
  function loadXrefData() {
    if (xrefData) return Promise.resolve(xrefData);
    if (xrefFetchPromise) return xrefFetchPromise;
    xrefFetchPromise = fetch("data/cross_references.json").then(function (res) {
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      return res.json();
    }).then(function (json) {
      xrefData = json;
      return xrefData;
    });
    return xrefFetchPromise;
  }

  function chapterNumbers(book) {
    var chapters = nivData && nivData[book];
    if (!chapters) return [];
    return Object.keys(chapters).map(function (c) { return parseInt(c, 10); })
      .sort(function (a, b) { return a - b; });
  }

  function nextChapterRef(book, chapter) {
    var chapters = chapterNumbers(book);
    var idx = chapters.indexOf(chapter);
    if (idx !== -1 && idx + 1 < chapters.length) {
      return { book: book, chapter: chapters[idx + 1] };
    }
    var bookIdx = BOOKS_IN_ORDER.indexOf(book);
    for (var i = bookIdx + 1; i < BOOKS_IN_ORDER.length; i++) {
      var nb = BOOKS_IN_ORDER[i];
      var nChapters = chapterNumbers(nb);
      if (nChapters.length) return { book: nb, chapter: nChapters[0] };
    }
    return null;
  }

  function collectRangeVerses(startBook, startCh, startV, endBook, endCh, endV) {
    var out = [];
    var book = startBook, chapter = startCh, verse = startV;
    var guard = 0;
    while (guard++ < 80) {
      var chapterVerses = nivData[book] && nivData[book][chapter];
      if (!chapterVerses) break;
      var text = chapterVerses[String(verse)];
      if (text) out.push({ book: book, chapter: chapter, verse: verse, text: text });
      if (book === endBook && chapter === endCh && verse === endV) break;
      var verseNums = Object.keys(chapterVerses).map(Number).sort(function (a, b) { return a - b; });
      var vIdx = verseNums.indexOf(verse);
      if (vIdx !== -1 && vIdx + 1 < verseNums.length) {
        verse = verseNums[vIdx + 1];
      } else {
        var nxt = nextChapterRef(book, chapter);
        if (!nxt) break;
        book = nxt.book;
        chapter = nxt.chapter;
        var nextVerseNums = Object.keys(nivData[book][chapter]).map(Number).sort(function (a, b) { return a - b; });
        verse = nextVerseNums[0];
      }
    }
    return out;
  }

  function formatXrefLabel(sb, sc, sv, eb, ec, ev) {
    if (sb === eb && sc === ec && sv === ev) return sb + " " + sc + ":" + sv;
    if (sb === eb && sc === ec) return sb + " " + sc + ":" + sv + "-" + ev;
    if (sb === eb) return sb + " " + sc + ":" + sv + "-" + ec + ":" + ev;
    return sb + " " + sc + ":" + sv + " - " + eb + " " + ec + ":" + ev;
  }

  function buildVerseLine(book, chapter, verse, text) {
    var line = document.createElement("span");
    line.className = "result-verse";

    var refEl = document.createElement("a");
    refEl.className = "verse-ref";
    refEl.href = "#";
    refEl.textContent = book + " " + chapter + ":" + verse + " ";
    refEl.addEventListener("click", function (e) {
      e.preventDefault();
      goToVerseInRead(book, chapter, verse);
    });
    line.appendChild(refEl);

    line.appendChild(document.createTextNode(text));
    return line;
  }

  // ============================================================
  // Column navigation (swipe/tap between Search, Read, Comments)
  // ============================================================
  var columnsWrap = document.getElementById("columns-wrap");
  var columnTabs = document.querySelectorAll(".column-tab");
  var columnTabsEl = document.querySelector(".column-tabs");

  // Slide the top tab bar out of the way while scrolling down on mobile (more
  // room to read, and lets the browser's own address bar collapse too, since
  // that only happens in response to the page's own scroll). Scroll events on
  // the individual columns don't bubble, so this listens during the capture
  // phase to catch them regardless of which column is scrolling.
  var tabsLastScrollY = 0;
  var tabsScrollScheduled = false;
  function updateColumnTabsVisibility(scrollTop) {
    if (isDesktopColumns()) {
      columnTabsEl.classList.remove("tabs-hidden");
      tabsLastScrollY = scrollTop;
      return;
    }
    if (scrollTop > tabsLastScrollY && scrollTop > columnTabsEl.offsetHeight) {
      columnTabsEl.classList.add("tabs-hidden");
    } else if (scrollTop < tabsLastScrollY) {
      columnTabsEl.classList.remove("tabs-hidden");
    }
    tabsLastScrollY = scrollTop;
  }
  document.addEventListener("scroll", function (e) {
    var target = e.target;
    if (!target || !target.classList || !target.classList.contains("column")) return;
    // Only the column the user is actually looking at should affect the tab
    // bar - otherwise an off-screen column's own scroll (e.g. Read jumping
    // straight to a saved reading position on load) can hide the bar before
    // it's even been shown.
    if (target.id !== getColumnIds()[currentColumnIndex()]) return;
    if (tabsScrollScheduled) return;
    tabsScrollScheduled = true;
    requestAnimationFrame(function () {
      tabsScrollScheduled = false;
      updateColumnTabsVisibility(target.scrollTop);
    });
  }, { capture: true, passive: true });

  function scrollToColumn(id, instant) {
    var col = document.getElementById(id);
    if (!col) return;
    col.scrollIntoView({ behavior: instant ? "auto" : "smooth", inline: "start", block: "nearest" });
  }

  columnTabs.forEach(function (tab) {
    tab.addEventListener("click", function () { scrollToColumn(tab.getAttribute("data-target")); });
  });

  // Comments isn't part of the mobile pager at all - there's a floating badge
  // on the highlight itself there instead (see layoutMobileCommentBadges).
  // Mobile pages through Notes/Bible/Search (in that visual order - see the
  // #col-notes/#col-read/#col-search `order` rules); desktop shows Comments
  // too since it's laid out as a real column there, not a floating badge.
  function getColumnIds() {
    return isDesktopColumns() ? ["col-search", "col-read", "col-comments"] : ["col-notes", "col-read", "col-search"];
  }

  function currentColumnIndex() {
    var COLUMN_IDS = getColumnIds();
    var mid = columnsWrap.scrollLeft + columnsWrap.clientWidth / 2;
    var best = 0, bestDist = Infinity;
    COLUMN_IDS.forEach(function (id, i) {
      var col = document.getElementById(id);
      var center = col.offsetLeft + col.clientWidth / 2;
      var dist = Math.abs(center - mid);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  function updateActiveColumnTab() {
    var best = getColumnIds()[currentColumnIndex()];
    columnTabs.forEach(function (tab) {
      tab.classList.toggle("active", tab.getAttribute("data-target") === best);
    });
    scheduleCommentsLayout();
  }
  var tabUpdateScheduled = false;
  columnsWrap.addEventListener("scroll", function () {
    if (tabUpdateScheduled) return;
    tabUpdateScheduled = true;
    requestAnimationFrame(function () {
      tabUpdateScheduled = false;
      updateActiveColumnTab();
    });
  }, { passive: true });
  updateActiveColumnTab();

  // A fast fling can carry native scroll-snap momentum past the next column
  // straight to the one after it - cap any single swipe/drag to moving at
  // most one column from wherever it started.
  var swipeStartColIndex = null;
  var swipeStartX = null;
  columnsWrap.addEventListener("touchstart", function (e) {
    swipeStartColIndex = currentColumnIndex();
    var touch = e.touches && e.touches[0];
    swipeStartX = touch ? touch.clientX : null;
  }, { passive: true });
  var scrollSettleTimer = null;
  columnsWrap.addEventListener("scroll", function () {
    clearTimeout(scrollSettleTimer);
    scrollSettleTimer = setTimeout(function () {
      if (swipeStartColIndex === null) return;
      var startIdx = swipeStartColIndex;
      swipeStartColIndex = null;
      var finalIdx = currentColumnIndex();
      var clamped = Math.max(startIdx - 1, Math.min(startIdx + 1, finalIdx));
      if (clamped !== finalIdx) scrollToColumn(getColumnIds()[clamped]);
    }, 120);
  }, { passive: true });

  // Infinite swipe: continuing to swipe past the last column wraps to the
  // first (and vice versa), rather than just stopping dead at the edge.
  // There's nothing to scroll to there natively, so no "scroll" event fires
  // for the gesture in that direction - this has to act on touchend directly
  // instead of through the scroll-settle clamp above.
  var SWIPE_WRAP_THRESHOLD = 40;
  columnsWrap.addEventListener("touchend", function (e) {
    if (swipeStartColIndex === null || swipeStartX === null) return;
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    var deltaX = touch.clientX - swipeStartX;
    var ids = getColumnIds();
    var startIdx = swipeStartColIndex;
    if (startIdx === 0 && deltaX > SWIPE_WRAP_THRESHOLD) {
      swipeStartColIndex = null;
      scrollToColumn(ids[ids.length - 1]);
    } else if (startIdx === ids.length - 1 && deltaX < -SWIPE_WRAP_THRESHOLD) {
      swipeStartColIndex = null;
      scrollToColumn(ids[0]);
    }
  }, { passive: true });

  function goToVerseInRead(book, chapter, verse) {
    scrollToColumn("col-read");
    navigateViaLink(book, chapter);
    if (verse) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var section = document.getElementById(sectionId(book, chapter));
          var sup = section && Array.prototype.find.call(
            section.querySelectorAll("sup.verse-num"),
            function (s) { return s.textContent === String(verse); }
          );
          if (sup) sup.scrollIntoView({ block: "center" });
        });
      });
    }
  }

  // ============================================================
  // Search column
  // ============================================================
  var resultsRenderedForQuery = false;
  var stuckTimer = null;

  var BIBLE_BOOKS = [
    "genesis", "exodus", "leviticus", "numbers", "deuteronomy", "joshua", "judges", "ruth",

      .map(function (v) { return parseInt(v, 10); })

  function scrapeVisibleResults() {
    var nodes = document.querySelectorAll(".gsc-webResult.gsc-result");
    var out = [];
    nodes.forEach(function (el) {
      var a = el.querySelector("a.gs-title");
      if (!a) return;

      var urlShort = el.querySelector(".gs-visibleUrl-short");
      out.push({
        title: a.textContent.trim(),

  function goToResultsPage(pageNumber) {
    var cursor = null;
    document.querySelectorAll(".gsc-cursor-page").forEach(function (el) {
      if (el.textContent.trim() === String(pageNumber)) cursor = el;
    });
    if (!cursor) return false;
    ["pointerdown", "mousedown", "pointerup", "mouseup", "click"].forEach(function (type) {
      cursor.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window }));
    });
    return true;
  }

  function waitForResultsUpdate(timeoutMs) {
    return new Promise(function (resolve) {
      var wrapper = document.querySelector(".gsc-results-wrapper-nooverlay, .gsc-results-wrapper-overlay");
      if (!wrapper) { resolve(); return; }
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        observer.disconnect();
        resolve();
      }, timeoutMs);
      var observer = new MutationObserver(function () {
        if (done) return;
        done = true;
        observer.disconnect();
        clearTimeout(timer);
        setTimeout(resolve, 50);
      });
      observer.observe(wrapper, { childList: true, subtree: true });
    });
  }

  function fetchAdditionalPages(maxPage, onPage) {
    var allExtra = [];
    var chain = Promise.resolve();
    var _loop = function (pageNum) {
      chain = chain.then(function () {
        var moved = goToResultsPage(pageNum);
        if (!moved) return;
        return waitForResultsUpdate(3000).then(function () {
          allExtra = allExtra.concat(scrapeVisibleResults());
          if (onPage) onPage(allExtra.slice());
        });
      });
    };
    for (var p = 2; p <= maxPage; p++) _loop(p);
    return chain.then(function () {
      goToResultsPage(1);
      return allExtra;
    });

  function markStillLoading() {
    var status = document.getElementById("results-status");

  function clearStillLoading() {

  function renderResults(items) {
    var list = document.getElementById("results-list");
    var status = document.getElementById("results-status");
    list.innerHTML = "";

    if (!items || !items.length) {
      status.textContent = "";
      return;
    }

    items = items.filter(function (item) {
      return !!extractReference(item.title);
    });

    if (!items.length) {
      status.textContent = "No Bible verse results found.";
      return;
    }

    var ranked = items
      .map(function (item, index) {
        return {
          item: item,
          index: index,
          isBook: mentionsBibleBook(item.title) || mentionsBibleBook(item.visibleUrl)
        };
      })
      .sort(function (a, b) {
        if (a.isBook !== b.isBook) return a.isBook ? -1 : 1;
        return a.index - b.index;
      })
      .map(function (entry) { return entry.item; });

    var seenRefs = {};
    var deduped = ranked.filter(function (item) {
      var ref = extractReference(item.title);
      if (!ref) return true;
      if (seenRefs[ref.label]) return false;
      seenRefs[ref.label] = true;
      return true;
    });

    deduped.forEach(function (item) {
      var li = document.createElement("li");

      var ref = extractReference(item.title);
      var verseText = ref ? lookupVerseText(ref) : null;

      if (verseText) {
        var toggle = document.createElement("a");
        toggle.href = "#";
        toggle.className = "result-toggle";
        toggle.textContent = item.title;
        li.appendChild(toggle);

        var verseLine = buildVerseLine(ref.book, ref.chapter, ref.verse, verseText + " ");
        var versionEl = document.createElement("span");
        versionEl.className = "verse-version";
        versionEl.textContent = "(NIV)";
        verseLine.appendChild(versionEl);
        li.appendChild(verseLine);

        var context = document.createElement("div");
        context.className = "verse-context";
        context.style.display = "none";

        var chapterVerses = getChapterVerses(ref.book, ref.chapter);
        var foundLineEl = null;
        chapterVerses.forEach(function (v) {
          var line = buildVerseLine(ref.book, ref.chapter, v.verse, v.text);
          if (String(v.verse) === ref.verse) {
            line.classList.add("verse-found");
            foundLineEl = line;
          }
          context.appendChild(line);
        });
        li.appendChild(context);
        toggle.addEventListener("click", function (e) {
          e.preventDefault();
          var expanded = context.style.display !== "none";
          context.style.display = expanded ? "none" : "block";
          verseLine.style.display = expanded ? "block" : "none";
          if (!expanded && foundLineEl) {
            foundLineEl.scrollIntoView({ block: "center" });
          }
        });

        var sourceLink = document.createElement("a");
        sourceLink.className = "source-link";
        sourceLink.href = item.url;
        sourceLink.target = "_blank";
        sourceLink.rel = "noopener noreferrer";
        sourceLink.textContent = "View source ↗";
        li.appendChild(sourceLink);

        var xrefToggle = document.createElement("a");
        xrefToggle.href = "#";
        xrefToggle.className = "source-link xref-link";
        xrefToggle.textContent = "Cross references";
        li.appendChild(xrefToggle);

        var xrefBox = document.createElement("div");
        xrefBox.className = "verse-context";
        xrefBox.style.display = "none";
        li.appendChild(xrefBox);

        var xrefLoaded = false;
        xrefToggle.addEventListener("click", function (e) {
          e.preventDefault();
          var expanded = xrefBox.style.display !== "none";
          xrefBox.style.display = expanded ? "none" : "block";
          if (!expanded && !xrefLoaded) {
            xrefLoaded = true;
            xrefBox.innerHTML = '<p class="xref-empty">Loading…</p>';
            loadXrefData().then(function () {
              renderXrefEntries(xrefBox, ref);
            }).catch(function () {
              xrefBox.innerHTML = '<p class="xref-empty">Couldn’t load cross reference data.</p>';
            });

        });
      } else {
        var a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.title;
        li.appendChild(a);

        var urlLine = document.createElement("span");
        urlLine.className = "result-url";
        urlLine.textContent = item.visibleUrl;
        li.appendChild(urlLine);
      }

      list.appendChild(li);
    });

  function findMarkVerseRef(mark) {
    var section = mark.closest(".chapter-section");
    if (!section) return null;
    var flow = section.querySelector(".verse-flow");
    var verse = null;
    var walker = document.createTreeWalker(flow, NodeFilter.SHOW_ALL, null);
    var node;
    while ((node = walker.nextNode())) {
      if (node.nodeType === 1 && node.classList.contains("verse-num")) {
        verse = node.textContent;
      }
      if (node === mark || (node.nodeType === 1 && node.contains(mark))) break;
    }
    return { book: section.dataset.book, chapter: section.dataset.chapter, verse: verse };
  }

  function openCommentEditor(mark) {
    hideSelectionMenu();
    activeCommentMark = mark;
    commentOriginalValue = mark.getAttribute("data-comment") || "";
    commentInput.value = commentOriginalValue;
    commentOverlay.style.display = "block";
  }
  function closeCommentEditor() {
    var mark = activeCommentMark;
    var newValue = commentInput.value;
    applyComment(newValue);
    if (mark && newValue.trim() && newValue !== commentOriginalValue) {
      var ref = findMarkVerseRef(mark);
      if (ref) logActivity("comment", ref.book, ref.chapter, ref.verse);
    }
    commentOverlay.style.display = "none";
    activeCommentMark = null;
  }
  function applyComment(text) {
    if (!activeCommentMark) return;
    var mark = activeCommentMark;
    var section = mark.closest(".chapter-section");
    if (text && text.trim()) {
      mark.setAttribute("data-comment", text);
      mark.title = text;
      mark.classList.add("commented");
    } else {
      mark.removeAttribute("data-comment");
      mark.removeAttribute("title");
      mark.classList.remove("commented");
    }
    if (section) saveHighlightState(section);
    renderCommentsColumn();
  }
  markReadTodayBtn.addEventListener("click", function () {
    if (!activeCommentMark) return;

    var original = markReadTodayBtn.textContent;
    markReadTodayBtn.textContent = "Logged ✓";
    setTimeout(function () { markReadTodayBtn.textContent = original; }, 1500);
  });

    var section = mark.closest(".chapter-section");
    var parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);

  function highlightKey(book, chapter) {
    return HIGHLIGHT_PREFIX + book + ":" + chapter;
  }
  function sectionId(book, chapter) {
    return "ch-" + book.replace(/\s+/g, "_") + "-" + chapter;
  }

  function renderWholeBible() {
    ALL_CHAPTERS = [];
    var html = "";
    BOOKS_IN_ORDER.forEach(function (book) {
      if (!nivData[book]) return;
      html += '<h2 class="book-heading">' + book + '</h2>';
      chapterNumbers(book).forEach(function (chapter) {
        ALL_CHAPTERS.push({ book: book, chapter: chapter });
        var key = highlightKey(book, chapter);
        var saved = localStorage.getItem(key);
        html += '<section class="chapter-section" id="' + sectionId(book, chapter) + '" data-book="' + book + '" data-chapter="' + chapter + '">';
        html += '<h3 class="chapter-heading">' + book + ' ' + chapter + '</h3>';
        html += '<div class="verse-flow">';
        if (saved) {
          html += saved;
        } else {
          var verses = nivData[book][chapter];
          var verseNums = Object.keys(verses).map(function (v) { return parseInt(v, 10); })
            .sort(function (a, b) { return a - b; });
          verseNums.forEach(function (v) {
            html += '<sup class="verse-num">' + v + '</sup>' + verses[String(v)] + " ";
          });
        }
        html += '</div></section>';
      });
    });
    textEl.innerHTML = html;
    setupObserver();
  }

  function setupObserver() {
    if (sectionObserver) sectionObserver.disconnect();
    sectionObserver = new IntersectionObserver(function (entries) {
      if (suppressObserver) return;
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var book = entry.target.getAttribute("data-book");
        var chapter = parseInt(entry.target.getAttribute("data-chapter"), 10);
        setCurrent(book, chapter, false);
      });
    }, { root: readColumn, rootMargin: "-10% 0px -80% 0px" });
    document.querySelectorAll(".chapter-section").forEach(function (el) { sectionObserver.observe(el); });
  }

  function populateBooks() {
    bookSelect.innerHTML = "";
    BOOKS_IN_ORDER.forEach(function (book) {
      if (!nivData[book]) return;
      var opt = document.createElement("option");
      opt.value = book;
      opt.textContent = book;
      bookSelect.appendChild(opt);
    });
  }
  function populateChapterOptions(book) {
    var chapters = chapterNumbers(book);
    chapterSelect.innerHTML = "";
    chapters.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = String(c);
      opt.textContent = "Chapter " + c;
      chapterSelect.appendChild(opt);
    });
  }

  function setCurrent(book, chapter, scrollTo) {
    var idx = ALL_CHAPTERS.findIndex(function (c) { return c.book === book && c.chapter === chapter; });
    if (idx === -1) return;
    currentIndex = idx;

    if (bookSelect.value !== book) {
      bookSelect.value = book;
      populateChapterOptions(book);
    }
    chapterSelect.value = String(chapter);

    localStorage.setItem("read:lastBook", book);
    localStorage.setItem("read:lastChapter:" + book, String(chapter));

    if (scrollTo) {
      suppressObserver = true;
      var sectionEl = document.getElementById(sectionId(book, chapter));
      var scrollTarget = sectionEl;
      // Chapter 1's section starts right where the previous book's text left
      // off - the book's own <h2> heading is a separate preceding sibling, not
      // part of the section, so scrolling to the section itself would leave
      // the heading off-screen above and land on the chapter/first verse
      // instead. Jumping to a book should show its title.
      if (chapterNumbers(book)[0] === chapter) {
        var prev = sectionEl.previousElementSibling;
        if (prev && prev.classList.contains("book-heading")) scrollTarget = prev;
      }
      scrollTarget.scrollIntoView({ behavior: "auto", block: "start" });
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          suppressObserver = false;
        });
      });
    }
  }

  function goTo(book, chapter) { setCurrent(book, chapter, true); }

  var navHistory = [];
  var navHistoryIndex = -1;

  function updateNavHistoryButtons() {
    prevBtn.disabled = navHistoryIndex <= 0;
    nextBtn.disabled = navHistoryIndex >= navHistory.length - 1;
  }

  function navigateViaLink(book, chapter) {
    var current = currentIndex !== -1 ? ALL_CHAPTERS[currentIndex] : null;
    navHistory = navHistory.slice(0, navHistoryIndex + 1);
    var top = navHistory[navHistory.length - 1];
    if (current && (!top || top.book !== current.book || top.chapter !== current.chapter)) {
      navHistory.push({ book: current.book, chapter: current.chapter });
    }
    navHistory.push({ book: book, chapter: chapter });
    navHistoryIndex = navHistory.length - 1;
    goTo(book, chapter);
    updateNavHistoryButtons();
  }

  function saveHighlightState(sectionEl) {
    var book = sectionEl.getAttribute("data-book");
    var chapter = sectionEl.getAttribute("data-chapter");

  function wrapRangeInMark(range) {

      var contents = range.extractContents();
      mark.appendChild(contents);

  function checkSelectionForMenu(clickX, clickY) {

    if (!sel || sel.rangeCount === 0) {

  // and replaced by the comment box once the click arrives - since at this
  // point the comment box hasn't opened yet. A real drag-selection that

  function findVerseRange(section, verseNum) {
    var flow = section.querySelector(".verse-flow");

  var BIBLEHUB_SLUGS = { "Song of Solomon": "songs" };

  function findSelectionVerseRef() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;

    var startNode = range.startContainer;
    var startEl = startNode.nodeType === 1 ? startNode : startNode.parentElement;
    var section = startEl ? startEl.closest(".chapter-section") : null;
    var flow = section ? section.querySelector(".verse-flow") : null;

    var verse = null;

    var node;
    while ((node = walker.nextNode())) {

      }
      if (node === startNode || (node.nodeType === 1 && node.contains(startNode))) {
        break;
      }
    }
    if (verse === null) return null;
    return { book: section.dataset.book, chapter: section.dataset.chapter, verse: verse };

  function buildCommentCard(refLabel, highlightText, commentText) {

  // Side by side with Read (desktop), comments sit level with the highlight
  // they belong to - like a margin note - instead of a plain stacked list,
  // and only for highlights currently on screen. On narrow screens Read and
  // Comments are never visible at once, so there's nothing to line up against
  // - it falls back to a plain scrollable list of every comment in the Bible.
  function layoutCommentsDesktop() {
    var marks = readerInited ? textEl.querySelectorAll("mark.highlight.commented") : [];
    var cards = [];
    marks.forEach(function (mark) {
      var r = mark.getBoundingClientRect();
      if (r.bottom < -200 || r.top > window.innerHeight + 200) return;
      cards.push({ mark: mark, top: r.top });
    });

    commentsEmpty.style.display = cards.length ? "none" : "block";
    commentsList.innerHTML = "";
    commentsList.style.position = "static";
    commentsList.style.minHeight = "";
    // Fixed (viewport-relative) positioning, same as top: c.top would mean under
    // position:fixed - matches mark.getBoundingClientRect() directly, with no
    // offset-parent math needed, and stays correct regardless of what scrolls.
    var colRect = commentsList.getBoundingClientRect();
    cards.forEach(function (c) {
      var mark = c.mark;
      var section = mark.closest(".chapter-section");
      var book = section.dataset.book, chapter = section.dataset.chapter;
      var card = buildCommentCard(book + " " + chapter, mark.textContent, mark.getAttribute("data-comment") || "");
      card.style.position = "fixed";
      card.style.left = colRect.left + "px";
      card.style.width = colRect.width + "px";
      card.style.top = c.top + "px";
      card.addEventListener("click", function () { openCommentEditor(mark); });
      commentsList.appendChild(card);
    });
  }

  var textPromptLabel = document.getElementById("text-prompt-label");
  var textPromptInput = document.getElementById("text-prompt-input");
  var textPromptOkBtn = document.getElementById("text-prompt-ok");
  var textPromptCancelBtn = document.getElementById("text-prompt-cancel");
  var textPromptResolve = null;

  function showTextPrompt(label, defaultValue) {
    textPromptLabel.textContent = label;
    textPromptInput.value = defaultValue || "";
    textPromptOverlay.style.display = "flex";
    textPromptInput.focus();
    textPromptInput.select();
    return new Promise(function (resolve) { textPromptResolve = resolve; });
  }
  function closeTextPrompt(value) {
    textPromptOverlay.style.display = "none";
    var resolve = textPromptResolve;
    textPromptResolve = null;
    if (resolve) resolve(value);
  }
  textPromptOkBtn.addEventListener("click", function () { closeTextPrompt(textPromptInput.value); });
  textPromptCancelBtn.addEventListener("click", function () { closeTextPrompt(null); });
  textPromptInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); closeTextPrompt(textPromptInput.value); }
    else if (e.key === "Escape") { closeTextPrompt(null); }
  });
  textPromptOverlay.addEventListener("click", function (e) {
    if (e.target === textPromptOverlay) closeTextPrompt(null);
  });

  // ============================================================
  // Notes column (CKEditor 5 rich-text outline editor - ported from
  // imswiming/Flowchart2's Notes panel, trimmed down to just the editor and
  // its tab bar: no remote sync, drawing inserts, or full-screen split panes,
  // since none of that applies here. Each tab is just a separate
  // {id, name, content} note, all saved together as one JSON array.)
  // ============================================================
  var NOTES_TABS_KEY = "notes:tabs";
  var NOTES_ACTIVE_TAB_KEY = "notes:activeTab";
  var NOTES_LEGACY_KEY = "notes:content"; // pre-tabs single-note blob, migrated below
  var notesEditor = null;
  var notesEditorEl = document.getElementById("notes-editor");

  // ============================================================
  // Every normal note tab (everything except Overview) gets a date heading +
  // "Thank God for:" gratitude box stamped at the top the first time it's
  // opened each day - see ensureTodaysDateBlock, called whenever a tab
  // becomes the active one. The heading/box are ordinary editable content
  // (not a separately-tracked field), which is why editing an entry later
  // can't retroactively change its date, and days are separated by a thin
  // <hr> (the bundle's HorizontalLine plugin, enabled in initNotesEditor).
  // The gratitude box is a <blockquote> so it grows with its text rather
  // than being a fixed-size box.
  //
  // Overview is the one exception - a plain, undated bullet list (newest at
  // the top) that the selection-menu/comment-editor/activity-row "Overview"
  // buttons add to; see addOverviewEntry.
  // ============================================================
  var OVERVIEW_TAB_NAME = "Overview";
  var GRATITUDE_HTML = "<blockquote><p><i>Thank God for: </i></p></blockquote>";
  function isOverviewTab(tab) { return !!tab && tab.name === OVERVIEW_TAB_NAME; }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }
  function todaysHeadingHtml() {
    var heading = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric", year: "numeric" });
    return "<h4>" + escapeHtml(heading) + "</h4>";
  }
  // Stamps today's date + gratitude box at the top of a (non-Overview) tab,
  // unless it's already there - safe to call every time a tab is shown.
  function ensureTodaysDateBlock(tab) {
    if (!tab || isOverviewTab(tab)) return;
    var headingHtml = todaysHeadingHtml();
    if (tab.content.indexOf(headingHtml) === 0) return;
    var newBlock = headingHtml + GRATITUDE_HTML;
    tab.content = tab.content ? newBlock + "<hr>" + tab.content : newBlock;
    saveNotesTabs();
  }

  function getOrCreateOverviewTab() {
    var tab = notesTabs.filter(isOverviewTab)[0];
    if (!tab) {
      tab = { id: "tab-" + Date.now(), name: OVERVIEW_TAB_NAME, content: "" };
      notesTabs.push(tab);
      saveNotesTabs();
      renderNotesTabBar();
    }
    return tab;
  }

  function addOverviewEntry(text) {
    if (!text) return;
    var tab = getOrCreateOverviewTab();
    var bulletHtml = "<li>" + escapeHtml(text) + "</li>";
    var ulOpenTag = tab.content.match(/^\s*<ul[^>]*>/i);
    tab.content = ulOpenTag
      ? tab.content.slice(0, ulOpenTag[0].length) + bulletHtml + tab.content.slice(ulOpenTag[0].length)
      : "<ul>" + bulletHtml + "</ul>" + tab.content;
    saveNotesTabs();
    if (tab.id === activeNotesTabId && notesEditor) notesEditor.setData(tab.content);
  }

  function loadNotesTabs() {
    try {
      var saved = JSON.parse(localStorage.getItem(NOTES_TABS_KEY) || "null");
      if (Array.isArray(saved) && saved.length) return saved;
    } catch (e) { /* fall through to a fresh/migrated tab list */ }
    var legacyContent = localStorage.getItem(NOTES_LEGACY_KEY);
    return [{ id: "tab-" + Date.now(), name: "Notes", content: legacyContent || "<p></p>" }];
  }
  var notesTabs = loadNotesTabs();
  var activeNotesTabId = localStorage.getItem(NOTES_ACTIVE_TAB_KEY);
  if (!notesTabs.some(function (t) { return t.id === activeNotesTabId; })) {
    activeNotesTabId = notesTabs[0].id;
  }

  function saveNotesTabs() { localStorage.setItem(NOTES_TABS_KEY, JSON.stringify(notesTabs)); }
  function getActiveNotesTab() {
    var found = notesTabs.filter(function (t) { return t.id === activeNotesTabId; })[0];
    return found || notesTabs[0];
  }
  // Flushes the editor's current content into its tab before anything (a tab
  // switch, adding/deleting a tab) replaces what the editor is showing.
  function saveActiveNotesTabContent() {
    if (!notesEditor) return;
    var tab = getActiveNotesTab();
    if (!tab) return;
    tab.content = notesEditor.getData();
    saveNotesTabs();
  }
  // Feeds the now-active tab's content into the editor. Safe to call before
  // CKEditor has finished loading (it's lazy - see ensureNotesEditorLoaded) -
  // it's just a no-op until notesEditor exists, since initNotesEditor() reads
  // getActiveNotesTab() itself once it does.
  function showActiveNotesTabContent() {
    var tab = getActiveNotesTab();
    ensureTodaysDateBlock(tab);
    if (notesEditor) notesEditor.setData(tab.content || "<p></p>");
  }
  function switchNotesTab(id) {
    if (id === activeNotesTabId) return;
    saveActiveNotesTabContent();
    activeNotesTabId = id;
    localStorage.setItem(NOTES_ACTIVE_TAB_KEY, id);
    showActiveNotesTabContent();
    renderNotesTabBar();
  }
  function addNotesTab() {
    showTextPrompt("Name for the new note:", "Untitled").then(function (name) {
      if (name === null) return;
      saveActiveNotesTabContent();
      var tab = { id: "tab-" + Date.now(), name: name.trim() || "Untitled", content: "" };
      notesTabs.push(tab);
      activeNotesTabId = tab.id;
      localStorage.setItem(NOTES_ACTIVE_TAB_KEY, tab.id);
      saveNotesTabs();
      showActiveNotesTabContent();
      renderNotesTabBar();
    });
  }
  function renameNotesTab(id) {
    var tab = notesTabs.filter(function (t) { return t.id === id; })[0];
    if (!tab) return;
    showTextPrompt("Rename this note:", tab.name).then(function (name) {
      if (name === null) return;
      tab.name = name.trim() || tab.name;
      saveNotesTabs();
      renderNotesTabBar();
    });
  }
  function deleteNotesTab(id) {
    if (notesTabs.length <= 1) return; // always keep at least one note
    var idx = notesTabs.map(function (t) { return t.id; }).indexOf(id);
    if (idx === -1) return;
    notesTabs.splice(idx, 1);
    saveNotesTabs();
    if (activeNotesTabId === id) {
      activeNotesTabId = notesTabs[Math.max(0, idx - 1)].id;
      localStorage.setItem(NOTES_ACTIVE_TAB_KEY, activeNotesTabId);
      showActiveNotesTabContent();
    }
    renderNotesTabBar();
  }

  function renderNotesTabBar() {
    var bar = document.getElementById("notes-tab-bar");
    if (!bar) return;
    bar.innerHTML = "";
    notesTabs.forEach(function (tab) {
      var isActive = tab.id === activeNotesTabId;
      var tabEl = document.createElement("button");
      tabEl.type = "button";
      tabEl.className = "notes-tab" + (isActive ? " active" : "");
      // dblclick doesn't fire reliably on phones - tapping a tab that's
      // already active renames it instead, same workaround Flowchart2 uses.
      tabEl.title = isActive ? "Tap again to rename" : tab.name;
      tabEl.addEventListener("click", function () {
        if (isActive) renameNotesTab(tab.id); else switchNotesTab(tab.id);
      });

      var label = document.createElement("span");
      label.textContent = tab.name || "Untitled";
      tabEl.appendChild(label);

      if (notesTabs.length > 1) {
        var closeBtn = document.createElement("span");
        closeBtn.className = "notes-tab-close";
        closeBtn.textContent = "×";
        closeBtn.title = "Delete this note";
        closeBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          deleteNotesTab(tab.id);
        });
        tabEl.appendChild(closeBtn);
      }
      bar.appendChild(tabEl);
    });

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "notes-tab notes-tab-add";
    addBtn.title = "Add a note";
    addBtn.textContent = "+";
    addBtn.addEventListener("click", addNotesTab);
    bar.appendChild(addBtn);
  }

  function notesActiveListType() {
    if (!notesEditor) return null;
    if (notesEditor.commands.get("bulletedList").value) return "bulletedList";
    if (notesEditor.commands.get("numberedList").value) return "numberedList";
    if (notesEditor.commands.get("todoList").value) return "todoList";
    return null;
  }

  function indentNotesLine() {
    if (!notesEditor) return;
    if (!notesActiveListType()) {
      notesEditor.execute("bulletedList");
    } else if (notesEditor.commands.get("indentList").isEnabled) {
      notesEditor.execute("indentList");
    }
    notesEditor.editing.view.focus();
  }

  function outdentNotesLine() {
    if (!notesEditor) return;
    notesEditor.execute("outdentList");
    notesEditor.editing.view.focus();
  }

  function buildNotesToolbar() {
    var row = document.getElementById("notes-toolbar");
    // Tapping a toolbar button must not pull focus out of the text (which
    // would drop the caret and close the on-screen keyboard mid-edit).
    row.addEventListener("mousedown", function (e) {
      if (e.target.closest("button")) e.preventDefault();
    });

    function makeBtn(text, title, onClick) {
      var b = document.createElement("button");
      b.className = "notes-toolbar-btn";
      b.type = "button";
      b.textContent = text;
      b.title = title;
      // Disabled until the editor actually loads (see ensureNotesEditorLoaded/
      // initNotesEditor) - it's a ~2MB lazy-loaded bundle, so there's a real
      // gap where these would otherwise silently do nothing when tapped,
      // which reads as broken rather than loading.
      b.disabled = true;
      b.addEventListener("click", onClick);
      row.appendChild(b);
      return b;
    }

    makeBtn("↩", "Undo", function () {
      if (!notesEditor) return;
      notesEditor.execute("undo");
      notesEditor.editing.view.focus();
    });
    makeBtn("↪", "Redo", function () {
      if (!notesEditor) return;
      notesEditor.execute("redo");
      notesEditor.editing.view.focus();
    });
    makeBtn("☑ Checklist", "Turn the selected (or current) lines into a checklist", function () {
      if (!notesEditor) return;
      notesEditor.execute("todoList");
      notesEditor.editing.view.focus();
    });
    makeBtn("T• Title", "Make the selected (or current) lines a bold title", function () {
      if (!notesEditor) return;
      var isTitle = notesEditor.commands.get("heading").value === "heading4";
      notesEditor.execute(isTitle ? "paragraph" : "heading", isTitle ? undefined : { value: "heading4" });
      notesEditor.editing.view.focus();
    });
    makeBtn("✏️ Highlight", "Highlight the selected text in yellow", function () {
      if (!notesEditor) return;
      var isHighlighted = notesEditor.commands.get("highlight").value === "yellowMarker";
      notesEditor.execute("highlight", { value: isHighlighted ? null : "yellowMarker" });
      notesEditor.editing.view.focus();
    });
    makeBtn("⇤ Outdent", "Decrease indent", outdentNotesLine);
    makeBtn("⇥ Indent", "Increase indent", indentNotesLine);

    // Unlike the formatting buttons above, this just switches tabs - it
    // works immediately rather than waiting on CKEditor to finish loading,
    // so it's added directly rather than through makeBtn (which disables
    // everything it creates until the editor is ready).
    var overviewTabBtn = document.createElement("button");
    overviewTabBtn.className = "notes-toolbar-btn";
    overviewTabBtn.type = "button";
    overviewTabBtn.textContent = "Overview";
    overviewTabBtn.title = "Jump to the Overview note";
    overviewTabBtn.addEventListener("click", function () { switchNotesTab(getOrCreateOverviewTab().id); });
    row.appendChild(overviewTabBtn);
  }

  function initNotesEditor() {
    if (!notesEditorEl) return;
    if (!window.CKEDITOR) {
      // vendor/ckeditor5/ckeditor5.umd.js (see ensureNotesEditorLoaded) failed
      // to load - surface this rather than silently showing an empty,
      // uneditable box.
      notesEditorEl.textContent = "Notes editor failed to load - check your connection and reload.";
      return;
    }
    var CK = window.CKEDITOR;
    CK.DecoupledEditor.create(notesEditorEl, {
      licenseKey: "GPL",
      plugins: [CK.Essentials, CK.Paragraph, CK.Heading, CK.List, CK.TodoList, CK.Highlight, CK.BlockQuote, CK.HorizontalLine],
      // Only paragraph/heading4 ("Title") are offered, matching the toolbar's
      // single "T Title" toggle button rather than a full heading-level picker.
      heading: {
        options: [
          { model: "paragraph", title: "Paragraph", class: "ck-heading_paragraph" },
          { model: "heading4", view: "h4", title: "Title", class: "ck-heading_heading4" }
        ]
      },
      // Just the one yellow marker - the Highlight button toggles this single
      // option on/off rather than offering a color picker.
      highlight: {
        options: [
          { model: "yellowMarker", class: "marker-yellow", title: "Yellow", color: "#ffee00", type: "marker" }
        ]
      },
      initialData: (function () { var tab = getActiveNotesTab(); ensureTodaysDateBlock(tab); return tab.content || "<p></p>"; })()
    }).then(function (editor) {
      // DecoupledEditor doesn't attach its own toolbar/UI anywhere by default -
      // this is driven entirely through the Checklist/Title/Outdent/Indent
      // buttons above instead, so editor.ui.view.toolbar.element is
      // deliberately never inserted into the page.
      notesEditor = editor;
      document.querySelectorAll("#notes-toolbar .notes-toolbar-btn").forEach(function (b) { b.disabled = false; });

      // Tab/Shift+Tab indent/outdent the current line - same commands as the
      // Indent/Outdent buttons. CKEditor's List plugin doesn't bind Tab for
      // this on its own, so left alone, Tab just moves focus to the next
      // focusable element (out of the editor entirely).
      editor.editing.view.document.on("keydown", function (evt, data) {
        if (data.domEvent.key === "Tab") {
          data.preventDefault();
          evt.stop();
          if (data.domEvent.shiftKey) outdentNotesLine(); else indentNotesLine();
          return;
        }
        // Plain Enter inside the gratitude box (a blockquote - see
        // ensureTodaysDateBlock) would otherwise start a new block, which on
        // an empty line is CKEditor's built-in signal to exit the quote
        // entirely - splitting the gratitude box into two instead of just
        // giving a newline within it. A soft break (Shift+Enter's own
        // command) stays inside the same block no matter what.
        if (data.domEvent.key === "Enter" && !data.domEvent.shiftKey) {
          var pos = editor.model.document.selection.getFirstPosition();
          for (var node = pos && pos.parent; node; node = node.parent) {
            if (node.name === "blockQuote") {
              data.preventDefault();
              evt.stop();
              editor.execute("shiftEnter");
              return;
            }
          }
        }
      }, { priority: "high" });

      var saveTimer = null;
      editor.model.document.on("change:data", function () {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveActiveNotesTabContent, 400);
      });
    }).catch(function (err) {
      console.error("Failed to create Notes editor:", err);
      notesEditorEl.textContent = "Notes editor failed to load - check your connection and reload.";
    });
  }

  // CKEditor's vendored bundle is ~2MB - at ~1100px+ Notes sits right there in
  // the desktop layout, but on mobile it's one of three pager columns most
  // visits never swipe to, so it's fetched and initialized only once the
  // column actually scrolls into view, not unconditionally on every load.
  var notesLoadStarted = false;
  function ensureNotesEditorLoaded() {
    if (notesLoadStarted) return;
    notesLoadStarted = true;
    if (notesEditorEl) notesEditorEl.textContent = "Loading editor…";
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "vendor/ckeditor5/ckeditor5.css";
    document.head.appendChild(link);
    var script = document.createElement("script");
    script.src = "vendor/ckeditor5/ckeditor5.umd.js";
    script.onload = initNotesEditor;
    script.onerror = function () {
      if (notesEditorEl) notesEditorEl.textContent = "Notes editor failed to load - check your connection and reload.";
    };
    document.head.appendChild(script);
  }

  buildNotesToolbar();
  renderNotesTabBar();
  showActiveNotesTabContent();
  var colNotesEl = document.getElementById("col-notes");
  if (colNotesEl) {
    // threshold 0.05 (not the default 0): at exactly scrollLeft 375 (Bible,
    // Notes's immediate neighbor in the pager), Notes' rect sits touching the
    // viewport edge with zero actual overlap - some browsers still report
    // that boundary touch as "intersecting" at threshold 0, which would defeat
    // the whole point of lazy-loading this. Requiring a sliver of real overlap
    // avoids that false positive while still firing well before it's fully
    // swiped into view.
    var notesVisibilityObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          ensureNotesEditorLoaded();
          notesVisibilityObserver.disconnect();
        }
      });
    }, { threshold: 0.05 });
    // Not armed immediately: the very first layout pass (before the page's
    // initial column/scroll position has settled - e.g. landing on Search, or
    // jumping to a saved reading position) can briefly and spuriously report
    // Notes as on-screen, which would defeat the whole point of lazy-loading
    // it. A short delay lets that settle first.
    setTimeout(function () { notesVisibilityObserver.observe(colNotesEl); }, 800);
  }
</script>
</body>
</html>
